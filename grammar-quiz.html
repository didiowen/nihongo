  { id:'c23-q9', ch:23, type:'mc', q:'向老師說明要先回去，哪句口氣最柔和客氣？', choices:['あたまが いたいので、きょうは かえります','あたまが いたいから、きょうは かえります','あたまが いたいです。だから、きょうは かえります'], answer:'あたまが いたいので、きょうは かえります', explain:'から 和 ので 都是「因為」，文法都對，差在口氣：から 像在講自己的主張，ので 柔和，對老師、長輩請假說明用 ので 最得體。句首的 だから 是隨便版的「所以」，對老師要用 ですから。', batch:20 },
  { id:'c23-q10', ch:23, type:'cloze', q:'あした しけんが あり___から、きょうは べんきょうします。', zh:'「因為明天有考試，今天要讀書。」——填 ある 的禮貌體語尾', answer:'ます', accepted:['ます'], romaji:'ashita shiken ga arimasu kara, kyou wa benkyou shimasu.', explain:'丁寧體直接接 から：あります＋から。事件用 あります（第 5 章 あした テストが あります）。前後都用ます，整句口氣一致。', batch:20 },
  { id:'c23-q11', ch:23, type:'cloze', q:'じかんが ありません___、タクシーで いきましょう。', zh:'「因為沒有時間，搭計程車去吧。」（タクシー＝計程車）——填表示原因的字', answer:'から', accepted:['から'], romaji:'jikan ga arimasen kara, takushii de ikimashou.', explain:'動詞否定的普通體還沒教（第 27 章），先用 ません 接 から。後面是約人的 ましょう，用 から 最自然；ので 很少接邀約。', batch:20 },
  { id:'c23-q12', ch:23, type:'cloze', q:'きのうは さむかった___、うちに いました。', zh:'「因為昨天很冷，待在家裡。」——填表示原因的字', answer:'ので', accepted:['ので','から'], romaji:'kinou wa samukatta node, uchi ni imashita.', explain:'い形容詞過去 さむかった（第 3 章）兩個字都能直接接。平穩地交代過去的情況，ので 常見；用 から 也對。', batch:20 },
  { id:'c23-q13', ch:23, type:'cloze', q:'あめです。___、うちに います。', zh:'「下雨了。所以待在家裡。」——填句首的「所以」（客氣版）', answer:'ですから', accepted:['ですから','だから'], romaji:'ame desu. desu kara, uchi ni imasu.', explain:'把 から 搬到句首、前面加 です／だ，就是「所以」。前一句用 です，接 ですから 口氣一致；だから 是朋友間的隨便版，跟第 1 章 です／だ 的分工一樣。', batch:20 },
  { id:'c23-q14', ch:23, type:'mc', q:'「因為下雨，所以待在家裡」哪句對？', choices:['あめだから、うちに います','あめだから、だから うちに います','だから あめ、うちに います'], answer:'あめだから、うちに います', explain:'中文「因為……所以……」前後都講，日文只講一次：理由後面已經有 から，不必再說 だから。から 永遠跟在理由後面，不放句首當「因為」。', batch:20 },
  { id:'c23-q15', ch:23, type:'mc', q:'「いそがしいから、いきません」是什麼意思？', choices:['因為很忙，所以不去','因為不去，所以很忙','雖然很忙，還是要去'], answer:'因為很忙，所以不去', explain:'から 前面那一半是理由：いそがしい（忙）是理由，いきません 是結果。中文「因為」放前面，日文 から 放在理由後面。「雖然……」是 が／けど 的工作，第 24 章會正式介紹。', batch:20 },
  { id:'c23-q16', ch:23, type:'mc', q:'「しずか」（安靜）接 ので，怎麼接？', choices:['しずかなので','しずかので','しずかだので'], answer:'しずかなので', explain:'ので＝の＋で，な形容詞碰到 の 要先補 な，跟第 15 章 もっと しずかなのは ありますか 同一條規則。だ 只配 から（しずかだから），沒有 ×だので。', batch:20 },
  { id:'c24-q1', ch:24, type:'cloze', q:'すしは おいしいです___、たかいです。', zh:'「壽司好吃，但是很貴。」——填「但是」', answer:'が', accepted:['が','けど','けれど','けれども','けども'], romaji:'sushi wa oishii desu ga, takai desu.', explain:'が／けど 黏在前半句的尾巴上，不是放在後半句開頭（台語的「毋過」才放後半句開頭）。接在 です 後面，不必補 だ。', batch:21 },
  { id:'c24-q2', ch:24, type:'cloze', q:'あめ___けど、いきます。', zh:'「雖然下雨，還是要去。」——填 けど 前面要補的字', answer:'だ', accepted:['だ','です'], romaji:'ame da kedo, ikimasu.', explain:'名詞接 けど 要先補 だ（客氣一點用 です）。跟第 23 章 あめだから 同一條規則：名詞不能光溜溜地接尾巴。', batch:21 },
  { id:'c24-q3', ch:24, type:'mc', q:'「コーヒーが すきですが、きょうは のみません」裡的第二個 が 是什麼意思？', choices:['但是','喜歡的對象','因為'], answer:'但是', explain:'看 が 前面站著誰：名詞後面（コーヒーが）是第 10 章的助詞，です 後面就是這一章的「但是」。「因為」是第 23 章的 から／ので。', batch:21 },
  { id:'c24-q4', ch:24, type:'mc', q:'「雖然下雨，還是要去」哪句對？', choices:['あめですが、いきます','あめが、いきます','あめが ですが、いきます'], answer:'あめですが、いきます', explain:'名詞後面直接接 が 會被讀成助詞（雨變成主語），要先補 です／だ。跟第 23 章 ×あめから 變成「從雨」是同一種漏字。', batch:21 },
  { id:'c24-q5', ch:24, type:'mc', q:'「しずか」（安靜）接 けど，哪個對？', choices:['しずかだけど','しずかけど','しずかいけど'], answer:'しずかだけど', explain:'しずか 是な形容詞，接 けど 要補 だ；×しずかい 是把它當成い形容詞（第 4 章誤判表）。客氣的說法是 しずかですけど。', batch:21 },
  { id:'c24-q6', ch:24, type:'mc', q:'「たかい」（貴）接 けど，哪個對？', choices:['たかいけど','たかいだけど','たかいなけど'], answer:'たかいけど', explain:'い形容詞兩邊都不補，直接接。×たかいだけど 跟第 23 章 ×さむいだから 是同一個錯，だ 是給な形容詞和名詞補的。', batch:21 },
  { id:'c24-q7', ch:24, type:'cloze', q:'へやは ちいさいです___、きれいです。', zh:'「房間小，但是很乾淨。」——填「但是」', answer:'けど', accepted:['けど','が','けれど','けれども','けども'], romaji:'heya wa chiisai desu kedo, kirei desu.', explain:'けど 口語、が 正式，這裡兩個都對。たかいですけど 這種前半客氣、尾巴放鬆的講法在日常對話最常聽到。', batch:21 },
  { id:'c24-q8', ch:24, type:'mc', q:'けれども／けども／けど 三個，哪一個最正式？', choices:['けれども','けども','けど'], answer:'けれども', explain:'けれども ＞ けれど ＞ けども ＞ けど，越短越隨便，講話用 けど。が 也是正式那一路，接在 です／ます 後面，公告和店員常用。', batch:21 },
  { id:'c24-q9', ch:24, type:'cloze', q:'さむいです___、そとに いきません。', zh:'「因為冷，所以不出去。」——順著走的那個字', answer:'から', accepted:['から','ので'], romaji:'samui desu kara, soto ni ikimasen.', explain:'前半句推著後半句走，用第 23 章的 から／ので。い形容詞接 から 不補だ，です 後面接也可以。', batch:21 },
  { id:'c24-q10', ch:24, type:'cloze', q:'さむいです___、そとに いきます。', zh:'「雖然冷，還是要出去。」——轉彎的那個字', answer:'が', accepted:['が','けど','けれど','けれども','けども'], romaji:'samui desu ga, soto ni ikimasu.', explain:'跟上一題同一句話，只換一個字，結論就相反：から 是順著走、が／けど 是被後半句推翻。看後半句站哪一邊就知道填哪個。', batch:21 },
  { id:'c24-q11', ch:24, type:'mc', q:'中文「雖然貴，但是要吃」，哪一句把轉折多講了一次？', choices:['たかいですが、でも たべます','たかいですが、たべます','たかいです。でも、たべます'], answer:'たかいですが、でも たべます', explain:'でも 站句首、が／けど 站句尾，一個轉折挑一個用就好。中文「雖然……但是……」兩邊都講，照搬會多一個，跟第 23 章 ×あめだから、だから 是同一個病。', batch:21 },
  { id:'c24-q12', ch:24, type:'mc', q:'「すみませんが、みずを ください」的 が 在做什麼？', choices:['先鋪一句緩衝再講正事','表示前後相反','表示原因'], answer:'先鋪一句緩衝再講正事', explain:'開場白的 が 沒有「但是」的意思，只是客氣的起手式，後面常接第 8 章的 ください／てください。', batch:21 },
  { id:'c24-q13', ch:24, type:'mc', q:'對方說「いきたいですけど……」然後不講了，最接近的意思是？', choices:['想去是想去，不過恐怕不行','一定會去','在問你去不去'], answer:'想去是想去，不過恐怕不行', explain:'けど 拖著不講完＝把拒絕留給對方猜，日本人很少把「不行」整句說出來。いきたい 是第 9 章的「想做」，有 たい 不代表事情會成真。', batch:21 },
  { id:'c24-q14', ch:24, type:'mc', q:'「コーヒーが すきです」的 が 是哪一種？', choices:['第 10 章的助詞：喜歡的對象','這一章的「但是」','第 23 章的「因為」'], answer:'第 10 章的助詞：喜歡的對象', explain:'同一個字兩個身分，看前面站著誰：名詞後面是助詞，です／ます 後面才是「但是」。', batch:21 },
  { id:'c24-q15', ch:24, type:'cloze', q:'えいがを みたいです___、じかんが ありません。', zh:'「想看電影，但是沒時間。」——填「但是」', answer:'が', accepted:['が','けど','けれど','けれども','けども'], romaji:'eiga o mitai desu ga, jikan ga arimasen.', explain:'たい（第 9 章）是い形容詞，接 です 再接 が。後半的 じかんが 是助詞的が——同一句裡兩種 が 各站各的位置。', batch:21 },
  { id:'c25-q1', ch:25, type:'cloze', q:'わたしは ともだちに チョコレートを ___。', zh:'「我送朋友巧克力。」——填「給」的動詞（ます形）', answer:'あげます', accepted:['あげます'], romaji:'watashi wa tomodachi ni chokoreeto o agemasu.', explain:'東西從我手上往外走，用 あげる。あげる 是る動詞，去る＋ます＝あげます。', batch:22 },
  { id:'c25-q2', ch:25, type:'cloze', q:'ともだちは わたしに はなを ___。', zh:'「朋友送了我花。」——填「給」的動詞（過去，ます形）', answer:'くれました', accepted:['くれました'], romaji:'tomodachi wa watashi ni hana o kuremashita.', explain:'東西從外面進到我這邊，用 くれる。くれる 是る動詞：去る＋ました＝くれました，不是 ×くりました。', batch:22 },
  { id:'c25-q3', ch:25, type:'cloze', q:'わたしは ともだち___ はなを もらいました。', zh:'「我從朋友那裡收到花。」——填標出「給的人」的助詞', answer:'に', accepted:['に','から'], romaji:'watashi wa tomodachi ni hana o moraimashita.', explain:'もらう 前面的 に 標的是「從誰」（來源），可以換成 から。同一個 に 放在 あげる／くれる 前面則是「給誰」。', batch:22 },
  { id:'c25-q4', ch:25, type:'mc', q:'「朋友給了我一支筆」哪句對？', choices:['ともだちは わたしに ペンを くれました','ともだちは わたしに ペンを あげました','わたしは ともだちに ペンを くれました'], answer:'ともだちは わたしに ペンを くれました', explain:'あげる 的箭頭只能往外，不能指回「我」，×わたしに あげました 是最典型的錯。くれる 的主語是給的人，×わたしは〜くれました 把方向倒過來了。', batch:22 },
  { id:'c25-q5', ch:25, type:'mc', q:'「わたしは あねに てがみを もらいました」是誰給誰信？', choices:['姊姊給我','我給姊姊','我和姊姊一起寫'], answer:'姊姊給我', romaji:'watashi wa ane ni tegami o moraimashita.', explain:'もらう 的主語是收的人（わたし），に 前面是給的人（あね）。華語「給」「收」各站一邊，日語 もらう 就是「收」。', batch:22 },
  { id:'c25-q6', ch:25, type:'mc', q:'「くれる」是什麼意思？', choices:['別人給我（或給我這邊的人）','我給別人','我收到'], answer:'別人給我（或給我這邊的人）', explain:'三個字一組：あげる＝我（這邊）給別人、くれる＝別人給我（這邊）、もらう＝我收到。あげる⇄くれる 箭頭方向相反，くれる⇄もらう 講同一件事、主角不同。', batch:22 },
  { id:'c25-q7', ch:25, type:'mc', q:'「もらう」是什麼意思？', choices:['收到（主語是收的人）','給別人','借給別人'], answer:'收到（主語是收的人）', explain:'もらう 站在收的那一端，批次12 學過。「借給別人」是 かす，它的另一半是 かりる，跟 あげる⇄もらう 一樣是方向對。', batch:22 },
  { id:'c25-q8', ch:25, type:'mc', q:'「みずを ください」的 ください 跟哪個動詞是一家？', choices:['くれる','あげる','もらう'], answer:'くれる', explain:'第 12 章學過 ください 來自 くださる，而 くださる 是 くれる 的尊敬語。所以 ください 的箭頭永遠指向我：「請（您）給我」。', batch:22 },
  { id:'c25-q9', ch:25, type:'mc', q:'開動前說的「いただきます」是哪個動詞的謙讓語？', choices:['もらう','くれる','あげる'], answer:'もらう', explain:'いただく＝もらう 的謙讓語，字面是「我領受了」，站在收的那一端。あげる 的謙讓語是 さしあげる（之後會學）。', batch:22 },
  { id:'c25-q10', ch:25, type:'mc', q:'「朋友送我妹妹蛋糕」哪句對？', choices:['ともだちは いもうとに ケーキを くれました','いもうとは ともだちに ケーキを くれました','ともだちは いもうとに ケーキを もらいました'], answer:'ともだちは いもうとに ケーキを くれました', explain:'妹妹在「我這邊」的圈裡，東西從外面進到我家，所以用 くれる。もらう 的主語必須是收的人，×ともだちは〜もらいました 主語站錯了。', batch:22 },
  { id:'c25-q11', ch:25, type:'cloze', q:'わたしは いもうとに ケーキを ___。', zh:'「我送了妹妹蛋糕。」——填「給」的動詞（過去，ます形）', answer:'あげました', accepted:['あげました'], romaji:'watashi wa imouto ni keeki o agemashita.', explain:'東西從我手上交出去，就算收的是家人也用 あげる。看的是東西離開我、還是進到我的圈，不是看對方是不是外人。', batch:22 },
  { id:'c25-q12', ch:25, type:'mc', q:'哪一句可以用 から？', choices:['わたしは せんせいから てがみを もらいました','わたしは せんせいから てがみを あげました','せんせいは わたしから てがみを くれました'], answer:'わたしは せんせいから てがみを もらいました', explain:'から 只配 もらう（東西從對方那裡來）。あげる／くれる 標的是收的人，用 に，不能換成 から。', batch:22 },
  { id:'c25-q13', ch:25, type:'cloze', q:'かさは だれ___ もらいましたか。', zh:'「傘是誰給妳的？」——填助詞', answer:'に', accepted:['に','から'], romaji:'kasa wa dare ni moraimashita ka.', explain:'問「妳從誰那裡收到」，用 もらう＋に（或 から）。回答把 だれ 換成人：あねに もらいました。句尾的 か 別漏（第 1 章）。', batch:22 },
  { id:'c25-q14', ch:25, type:'mc', q:'もらう 的ます形是哪一個？', choices:['もらいます','もらえます','もらます'], answer:'もらいます', explain:'もらう 是う動詞，u→i＋ます＝もらいます。もらえます 是第 10、16 章的可能形（u→e，能收到），ます形塞錯位置的老問題又來了。', batch:22 },
  { id:'c25-q15', ch:25, type:'mc', q:'「ともだちは わたしに はなを くれました」換成用 もらう，哪句講的是同一件事？', choices:['わたしは ともだちに はなを もらいました','ともだちは わたしに はなを もらいました','わたしは ともだちに はなを あげました'], answer:'わたしは ともだちに はなを もらいました', romaji:'tomodachi wa watashi ni hana o kuremashita.', explain:'同一件事兩種講法：くれる 讓送的人當主語，もらう 讓收的人當主語，に 前面也跟著換成送的人。×わたしは〜あげました 是方向反過來的另一件事。', batch:22 },
  { id:'c26-q1', ch:26, type:'cloze', q:'きのう ともだちと えいがを ___。', zh:'「昨天跟朋友看了電影。」——對朋友講，填 みる 的普通體過去', answer:'みた', accepted:['みた','見た'], explain:'みる 是る動詞，去る＋た＝みた。對朋友、家人講話穿便服，ました 的便服就是 た形。', batch:23 },
  { id:'c26-q2', ch:26, type:'cloze', q:'コーヒーを ___。', zh:'「喝了咖啡。」——填 のむ 的た形', answer:'のんだ', accepted:['のんだ','飲んだ'], romaji:'koohii o nonda.', explain:'む 結尾走 ぬ・ぶ・む 那組：て形 のんで → た形 のんだ。で 是濁音，た 也跟著濁成 だ，不是 ×のんた。', batch:23 },
  { id:'c26-q3', ch:26, type:'cloze', q:'せんしゅう ほんを ___。', zh:'「上週買了書。」——填 かう 的た形', answer:'かった', accepted:['かった','買った'], explain:'う 結尾走 う・つ・る 那組：かって → かった。它和い形容詞的過去語尾（たかかった）同音，看前面接的是動詞還是形容詞就分得出來。', batch:23 },
  { id:'c26-q4', ch:26, type:'cloze', q:'きのう ともだちの うちに ___。', zh:'「昨天去了朋友家。」——填 いく 的た形', answer:'いった', accepted:['いった','行った'], explain:'いく 是唯一的不規則：語尾是く卻走「った」，×いいた 是錯的。跟第 7 章て形 いって 是同一個例外。', batch:23 },
  { id:'c26-q5', ch:26, type:'cloze', q:'せんせいと にほんごで ___。', zh:'「和老師用日語說了話。」——填 はなす 的た形', answer:'はなした', accepted:['はなした','話した'], explain:'す 結尾沒有音便：はなして → はなした。で 在這裡是第 16 章「靠什麼」的 で（用日語）。', batch:23 },
  { id:'c26-q6', ch:26, type:'cloze', q:'ラジオで ニュースを ___。', zh:'「用收音機聽了新聞。」——填 きく 的た形', answer:'きいた', accepted:['きいた','聞いた'], romaji:'rajio de nyuusu o kiita.', explain:'く 結尾：きいて → きいた。別跟 くる 的 きた（來了）搞混——多一個 い 就是「聽了」。', batch:23 },
  { id:'c26-q7', ch:26, type:'cloze', q:'えきまで ___。', zh:'「趕到了車站。」——填 いそぐ 的た形', answer:'いそいだ', accepted:['いそいだ','急いだ'], explain:'ぐ 結尾：いそいで → いそいだ。ぐ 的濁點從て形的 で 一路帶到 だ，×いそいた 是把濁點弄丟了。まで 是第 18 章的「到」。', batch:23 },
  { id:'c26-q8', ch:26, type:'cloze', q:'ともだちが うちに ___。', zh:'「朋友來家裡了。」——填 くる 的た形', answer:'きた', accepted:['きた','来た'], explain:'くる 整個換掉：きます／きて／きた，都是 き 開頭。×くった 是把它當成う動詞。', batch:23 },
  { id:'c26-q9', ch:26, type:'cloze', q:'きのう にほんごを べんきょう___。', zh:'「昨天讀了日語。」——填 する 的た形', answer:'した', accepted:['した'], explain:'する → した（します → しました 的便服）。所有「名詞＋する」都一樣：べんきょうした、かいものした。', batch:23 },
  { id:'c26-q10', ch:26, type:'mc', q:'あそぶ 的た形是哪一個？', choices:['あそんだ','あそった','あそびた'], answer:'あそんだ', explain:'ぶ 結尾走 ぬ・ぶ・む → んだ。×あそびた 是把ます形語幹 あそび 直接接 た——た形要從て形換，不是從ます形接。', batch:23 },
  { id:'c26-q11', ch:26, type:'mc', q:'對老師說「我昨天看了那本書」，哪句最合適？', choices:['きのう その ほんを よみました','きのう その ほんを よんだ','きのう その ほんを よみた'], answer:'きのう その ほんを よみました', explain:'對老師、長輩要穿西裝（ました）。よんだ 文法沒錯，但普通體是「親近的版本」，對老師用會失禮。×よみた 是ます形語幹接 た 的錯。', batch:23 },
  { id:'c26-q12', ch:26, type:'mc', q:'「上週買的書」哪一個對？', choices:['せんしゅう かった ほん','せんしゅう かいました ほん','せんしゅう かったの ほん'], answer:'せんしゅう かった ほん', explain:'修飾名詞的位置只能放普通體（第 11 章），×かいました ほん 是把西裝塞進修飾位置。中文的「的」也不翻成 の。', batch:23 },

// ═══════════════════════════════
// FIREBASE SYNC CONFIG
// ═══════════════════════════════
const FIREBASE_DB_URL = 'https://nihongo-2ad36-default-rtdb.asia-southeast1.firebasedatabase.app';
const QUIZ_TYPE = 'grammar';   // → /progress/<user>/grammar.json，與 hiragana/katakana 分開

// quiz-common.js 硬寫死兩個 bucket（kana/vocab）。文法只需要一個：
// 把 vocab bucket 拿來裝文法卡（key=題目 id），kana bucket 空著但名字必須存在。
const STORAGE_KANA  = 'grammar_unused_progress';
const STORAGE_VOCAB = 'grammar_srs_progress';

// ═══════════════════════════════
// STATE（quiz-common.js 契約要求的外層變數）
// ═══════════════════════════════
// escapeHtml 在 quiz-common.js 也有定義（同款）；這裡先定義一份是因為
// 章節篩選列在 quiz-common.js 載入前就要渲染（deep-link IIFE）。
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

let kanaProgress = {};
let vocabProgress = {};
let totalAnswered = 0, totalCorrect = 0, streak = 0, sessionCount = 0;
let wrongAnswers = new Map();

let grammarQueue = [];
let currentQ = null;
let currentChoices = [];
let answered = false;
let chFilter = 0;   // 0 = 全部

// ═══════════════════════════════
// QUEUE
// ═══════════════════════════════
function getFilteredCards() {
  const pool = chFilter ? grammarCards.filter(c => c.ch === chFilter) : grammarCards;
  return pool.map(c => {
    const saved = vocabProgress[c.id];
    return { ...c, display: c.id,                       // 讓 quiz-common 的 advanceSRS 直接可用
             level: saved ?? 0,
             nextReview: saved != null ? 0 : -(c.batch * 5) };  // 新批次優先，同 recentBatch 算法
  });
}

// 假名→羅馬字（wapuro 慣例：おう→ou、ー複製前母音、ん→n）。
// 助詞啟發式：句中 は→wa（はなし／はなす 開頭的詞例外）、を 一律當助詞 →" o "。
// 句子含漢字或棘手讀音時，題卡可加 romaji 欄位手動覆寫（見 CLAUDE.md）。
const _K = {
'あ':'a','い':'i','う':'u','え':'e','お':'o','か':'ka','き':'ki','く':'ku','け':'ke','こ':'ko',
'さ':'sa','し':'shi','す':'su','せ':'se','そ':'so','た':'ta','ち':'chi','つ':'tsu','て':'te','と':'to',
'な':'na','に':'ni','ぬ':'nu','ね':'ne','の':'no','は':'ha','ひ':'hi','ふ':'fu','へ':'he','ほ':'ho',
'ま':'ma','み':'mi','む':'mu','め':'me','も':'mo','や':'ya','ゆ':'yu','よ':'yo',
'ら':'ra','り':'ri','る':'ru','れ':'re','ろ':'ro','わ':'wa','を':' o ','ん':'n',
'が':'ga','ぎ':'gi','ぐ':'gu','げ':'ge','ご':'go','ざ':'za','じ':'ji','ず':'zu','ぜ':'ze','ぞ':'zo',
'だ':'da','ぢ':'ji','づ':'zu','で':'de','ど':'do','ば':'ba','び':'bi','ぶ':'bu','べ':'be','ぼ':'bo',
'ぱ':'pa','ぴ':'pi','ぷ':'pu','ぺ':'pe','ぽ':'po',
};
const _SMALL = { 'ゃ':'ya', 'ゅ':'yu', 'ょ':'yo' };
function kanaToRomaji(text) {
  let s = [...text].map(c => {
    const code = c.codePointAt(0);
    return (code >= 0x30A1 && code <= 0x30F6) ? String.fromCodePoint(code - 0x60) : c;
  }).join('');
  let out = '', i = 0;
  while (i < s.length) {
    const c = s[i], nx = s[i + 1];
    if (c === 'っ') {
      const peek = kanaToRomaji(s.slice(i + 1, i + 3)).trim();
      out += peek ? peek[0] : 'tsu'; i++; continue;
    }
    if (c === 'は' && i > 0 && !/^(なして|なします|なす)/.test(s.slice(i + 1))) {
      out += ' wa '; i++; continue;
    }
    if (_K[c]) {
      let r = _K[c];
      if (_SMALL[nx]) {
        const y = _SMALL[nx];
        r = (['shi','chi','ji'].includes(r)) ? r.slice(0, -1) + y.slice(1) : r.slice(0, -1) + y;
        i++;
      }
      out += r; i++; continue;
    }
    if (c === 'ー') { const m = out.match(/[aiueo]$/); out += m ? m[0] : ''; i++; continue; }
    if (c === '、' || c === '，') { out += ', '; i++; continue; }
    if (c === '。') { out += '.'; i++; continue; }
    out += c; i++;
  }
  return out.replace(/\s+/g, ' ').trim();
}

// 全形／半形、空白、常見標點差異不算錯
function normJa(s) {
  return s.normalize('NFKC').trim().replace(/\s+/g, '').replace(/[。、．，]/g, '');
}

function chapterOf(n) { return chapters.find(x => x.n === n); }
function chapterHref(n) { return `grammar/${String(n).padStart(2, '0')}.html`; }

// ═══════════════════════════════
// 章節篩選列（動態生成，新章自動出現）
// ═══════════════════════════════
function buildChFilter() {
  const wrap = document.getElementById('chFilter');
  const btns = [`<button class="round-btn${chFilter === 0 ? ' active' : ''}" data-ch="0">全部</button>`]
    .concat(chapters.map(c =>
      `<button class="round-btn${chFilter === c.n ? ' active' : ''}" data-ch="${c.n}" title="${escapeHtml(c.title)}">第${c.n}章</button>`));
  wrap.innerHTML = btns.join('');
  wrap.querySelectorAll('.round-btn').forEach(b =>
    b.addEventListener('click', () => setChapter(parseInt(b.dataset.ch, 10))));
}

function setChapter(n) {
  chFilter = n;
  buildChFilter();
  rebuildQueues();
  resetScore();
  nextCard();
}

// ═══════════════════════════════
// RENDER
// ═══════════════════════════════
function renderCloze() {
  const qHtml = escapeHtml(currentQ.q).replace('___', '<span class="blank">＿＿</span>');
  document.getElementById('quizContent').innerHTML = `
    <div class="question-type">第${currentQ.ch}章 · 填空（輸入假名）</div>
    <div class="cloze-q">${qHtml}</div>
    ${currentQ.zh ? `<div class="cloze-zh">${escapeHtml(currentQ.zh)}</div>` : ''}
    <div class="input-wrap">
      <input class="romaji-input" id="clozeInput" type="text" placeholder="輸入假名…"
        autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false">
    </div>
    <button class="submit-btn" id="submitBtn">確認</button>
    <div class="feedback" id="feedback"></div>
    <button class="next-btn" id="nextBtn">下一題 →</button>
  `;
  const inp = document.getElementById('clozeInput');
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') submitCloze(); });
  document.getElementById('submitBtn').addEventListener('click', submitCloze);
  document.getElementById('nextBtn').addEventListener('click', nextCard);
  setTimeout(() => inp?.focus(), 80);
}

function submitCloze() {
  if (answered) return;
  const inp = document.getElementById('clozeInput');
  if (!inp?.value.trim()) return;
  answered = true;
  const isCorrect = currentQ.accepted.map(normJa).includes(normJa(inp.value));
  inp.disabled = true;
  inp.classList.add(isCorrect ? 'correct' : 'wrong');
  showFeedback(isCorrect);
}

function renderMC() {
  currentChoices = shuffle([...currentQ.choices]);
  document.getElementById('quizContent').innerHTML = `
    <div class="question-type">第${currentQ.ch}章 · 選擇</div>
    <div class="mc-q">${escapeHtml(currentQ.q)}</div>
    <div class="options">
      ${currentChoices.map((opt, i) => `<button class="option-btn" data-i="${i}">${escapeHtml(opt)}</button>`).join('')}
    </div>
    <div class="feedback" id="feedback"></div>
    <button class="next-btn" id="nextBtn">下一題 →</button>
  `;
  document.querySelectorAll('.option-btn').forEach(b =>
    b.addEventListener('click', () => checkMC(parseInt(b.dataset.i, 10), b)));
  document.getElementById('nextBtn').addEventListener('click', nextCard);
}

function checkMC(i, btn) {
  if (answered) return;
  answered = true;
  const chosen = currentChoices[i];
  const isCorrect = chosen === currentQ.answer;
  document.querySelectorAll('.option-btn').forEach(b => {
    b.disabled = true;
    if (currentChoices[parseInt(b.dataset.i, 10)] === currentQ.answer) b.classList.add('correct');
  });
  if (!isCorrect) btn.classList.add('wrong');
  showFeedback(isCorrect);
}

function showFeedback(isCorrect) {
  advanceSRS(currentQ, isCorrect);
  const fb = document.getElementById('feedback');
  fb.className = `feedback ${isCorrect ? 'show-correct' : 'show-wrong'}`;
  const jaAnswer = /[ぁ-ゖァ-ヺ一-龯]/.test(currentQ.answer);
  const speak = jaAnswer
    ? ` <button class="speak-btn" id="speakAns" title="朗讀">🔊</button>` : '';
  // 作答後顯示羅馬字：cloze 是整句（代入答案）、mc 是答案句（含日文才顯示）。
  // 題卡的 romaji 欄位可覆寫自動轉換。
  const romajiSrc = currentQ.type === 'cloze' ? currentQ.q.replace('___', currentQ.answer) : currentQ.answer;
  const romaji = currentQ.romaji || (/[ぁ-ゖァ-ヺ]/.test(romajiSrc) ? kanaToRomaji(romajiSrc) : '');
  fb.innerHTML = (isCorrect ? '✓ 正確！' : `✗ 正確是「${escapeHtml(currentQ.answer)}」`) + speak +
    (romaji ? `<div class="romaji-line">${escapeHtml(romaji)}</div>` : '') +
    `<div class="explain">${escapeHtml(currentQ.explain)}　<a href="${chapterHref(currentQ.ch)}">回第${currentQ.ch}章 →</a></div>`;
  document.getElementById('speakAns')?.addEventListener('click', () => {
    // cloze 唸完整句（把空格代入答案），mc 唸答案句
    const text = currentQ.type === 'cloze' ? currentQ.q.replace('___', currentQ.answer) : currentQ.answer;
    speakJa(text);
  });
  document.getElementById('nextBtn').classList.add('visible');
}

// ═══════════════════════════════
// PAGE HOOK（quiz-common.js 呼叫）
// ═══════════════════════════════
function getSessionLimit() {
  const pool = (chFilter ? grammarCards.filter(c => c.ch === chFilter) : grammarCards).length;
  return Math.min(Math.max(Math.round(pool * 0.5), 10), 30);
}

function rebuildQueues() {
  grammarQueue = getFilteredCards();
}

function nextCard() {
  answered = false;
  if (sessionCount >= getSessionLimit()) { showResult(); return; }
  currentQ = pickFromQueue(grammarQueue);
  if (!currentQ) {
    if (sessionCount === 0) {
      document.getElementById('quizContent').innerHTML = `
        <div class="all-done"><div class="big-emoji">🌤️</div>
        這一章的題目今天都複習過了。<br>換一章，或選「全部」再練。</div>`;
      return;
    }
    showResult();
    return;
  }
  if (currentQ.type === 'mc') renderMC(); else renderCloze();
  updateProgress();
}

function restartCurrent() {
  rebuildQueues();
  resetScore();
  nextCard();
}

// ?ch=N deep link（在 quiz-common.js boot 之前生效）
(() => {
  const p = parseInt(new URLSearchParams(location.search).get('ch') || '0', 10);
  if (chapters.some(c => c.n === p)) chFilter = p;
  buildChFilter();
})();
</script>
<script src="quiz-common.js"></script>
<script>
// 覆寫 quiz-common.js 的 renderWrongList：它假設卡片是假名／單字（char/display＋reading＋meaning），
// 文法卡沒有那些欄位。必須放在 quiz-common.js 之後（showResult 執行時才會呼叫，重綁安全）。
function renderWrongList() {
  if (wrongAnswers.size === 0) return '';
  const items = [...wrongAnswers.values()].map(c => {
    const ch = chapterOf(c.ch);
    return `<div class="wrong-item">
      <span class="wrong-front">${escapeHtml(c.q.replace('___', '＿＿'))}</span>
      <span class="wrong-back">✓ ${escapeHtml(c.answer)}<br>${escapeHtml(c.explain)}<br>
        <a href="${chapterHref(c.ch)}">${escapeHtml(ch ? ch.title : '第' + c.ch + '章')} →</a></span>
    </div>`;
  }).join('');
  return `<div class="wrong-list"><div class="wrong-title">答錯回顧（${wrongAnswers.size}）</div>${items}</div>`;
}
</script>
