<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>N5 文法測驗</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+TC:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="quiz-common.css">
<style>

/* ── 文法題頁面差異 ── */

/* 題目句（cloze）：比假名小、比內文大，行高鬆一點 */
.cloze-q {
  font-size: 1.35rem;
  line-height: 1.9;
  margin: 18px 0 6px;
  font-family: 'Noto Sans JP', 'Noto Sans TC', sans-serif;
}
.cloze-zh {
  font-size: 0.95rem;
  color: var(--neutral);
  margin-bottom: 14px;
}
.blank {
  color: var(--accent);
  border-bottom: 2px dotted var(--accent);
  padding: 0 6px;
  letter-spacing: 0.1em;
}

/* mc 題幹 */
.mc-q {
  font-size: 1.15rem;
  line-height: 1.8;
  margin: 18px 0 14px;
}

/* 文法選項是完整句子：改單欄、左對齊 */
.options { grid-template-columns: 1fr; }
.option-btn { text-align: left; font-size: 1.02rem; line-height: 1.6; }

/* 章節篩選列可能超過一行 */
.round-filter { flex-wrap: wrap; }
.round-btn { flex: none; padding: 8px 14px; }

/* 作答後的羅馬字行 */
.romaji-line {
  margin-top: 8px;
  font-size: 0.88rem;
  color: var(--neutral);
  letter-spacing: 0.03em;
  text-align: left;
}

/* 答後解說 */
.explain {
  margin-top: 10px;
  font-size: 0.92rem;
  color: var(--soft);
  line-height: 1.7;
  text-align: left;
}
.explain a { color: var(--accent); }

/* 空佇列訊息 */
.all-done {
  text-align: center;
  padding: 40px 0;
  color: var(--soft);
}
.all-done .big-emoji { font-size: 3rem; margin-bottom: 12px; }
</style>
</head>
<body>

<nav class="nav-links">
  <a href="index.html">← 首頁</a>
  <a href="grammar/">📖 文法章節</a>
  <button class="user-badge" id="userBadge" onclick="openUserModal()" title="切換使用者">
    <span class="sync-dot" id="syncDot"></span>
    <span id="userLabel">…</span>
  </button>
</nav>

<div class="user-modal-overlay" id="userModalOverlay">
  <div class="user-modal">
    <h3>設定使用者 ID</h3>
    <p>輸入你的專屬 ID（3–20 個英文字母、數字、<code>-</code> 或 <code>_</code>）。不同裝置輸入相同 ID 即可同步進度。</p>
    <input type="text" id="userIdInput" placeholder="例：didi-2026" maxlength="20"
      onkeydown="if(event.key==='Enter')confirmUserId()" autocomplete="off" />
    <div class="user-modal-err" id="userModalErr"></div>
    <div class="user-modal-btns">
      <button class="btn-cancel" id="userCancelBtn" onclick="closeUserModal()">取消</button>
      <button class="btn-confirm" onclick="confirmUserId()">確認</button>
    </div>
  </div>
</div>

<!-- 章節篩選（由 chapters 陣列動態生成，每天新章自動出現） -->
<div class="round-filter" id="chFilter"></div>

<div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>

<div class="card" id="mainCard">
  <span class="sr-badge">SRS</span>
  <div id="quizContent"></div>
</div>

<div class="score-display">
  <div class="score-item"><span class="score-num" id="scoreCorrect">0</span>正確</div>
  <div class="score-item"><span class="score-num" id="scoreTotal">0</span>已答</div>
  <div class="score-item"><span class="score-num" id="scoreStreak">0</span>連勝</div>
</div>

<script>
// ═══════════════════════════════
// DATA — 章節清單（與 grammar/chapters.json 同步，validate_quiz_data.py 會比對）
// 每日排程教到新章時在末尾加一行 { n, title }。
// ═══════════════════════════════
const chapters = [
  { n: 1, title: 'X は Y です' },
  { n: 2, title: '助詞比較：は vs を' },
  { n: 3, title: 'い形容詞' },
  { n: 4, title: 'な形容詞' },
  { n: 5, title: 'あります／います' },
  { n: 6, title: 'ます形（動詞禮貌體）' },
  { n: 7, title: 'て形' },
  { n: 8, title: '〜てください' },
  { n: 9, title: '〜たい' },
  { n: 10, title: '〜が＋可能形（能力表達）' },
  { n: 11, title: '修飾名詞：動詞句前置' },
  { n: 12, title: '敬語入門：妳已經在用的那些' },
  { n: 13, title: '〜になる（變成〜）' },
  { n: 14, title: '〜てもいいですか（可以〜嗎？）' },
  { n: 15, title: 'もっと〜のはありますか（有更〜的嗎？）' },
  { n: 16, title: '〜で払えますか（可以用〜付款嗎？）' },
  { n: 17, title: '〜ています（持續狀態 / 結果狀態）' },
  { n: 18, title: '〜まで何分ですか（到〜要幾分鐘？）' },
  { n: 19, title: '〜を預けられますか（可以寄放〜嗎？）' },
  { n: 20, title: '〜も〜も（不管是〜還是〜都）' },
  { n: 21, title: 'Vます形＋やすい／にくい（容易／難〜）' },
  { n: 22, title: '〜ましょう（一起〜吧）' },
  { n: 23, title: 'から／ので（因為〜）' },
  { n: 24, title: 'が／けど（但是〜）' },
  { n: 25, title: 'あげる／もらう／くれる（給的三個方向）' },
  { n: 26, title: 'た形（普通體過去式）' },
];

// ═══════════════════════════════
// DATA — 文法題庫（一行一題；每日排程在末尾追加 3–5 題）
// 欄位：id（SRS key，cNN-qM，NN=進度項編號）、ch、type（cloze=輸入／mc=選擇）、
//       q（cloze 必含 ___）、answer、accepted（cloze，含 answer）、
//       choices（mc ≥3 且含 answer）、explain（必填）、batch（同天同批，越大越新）
// 修錯字保留 id；改題意換新 id 並刪舊行（避免舊 SRS 等級掛在新題上）。
// ═══════════════════════════════
const grammarCards = [
  // ── 第 1 章 X は Y です ──
  { id:'c01-q1', ch:1, type:'cloze', q:'これはすしです___。', zh:'「這是壽司嗎？」——把疑問語氣補完', answer:'か', accepted:['か'], explain:'疑問句句尾的 か 不能漏：〜ですか。少了 か 就變成直述句「這是壽司」。', batch:1 },
  { id:'c01-q2', ch:1, type:'mc', q:'「那不是咖啡。」哪一句對？', choices:['あれはコーヒーじゃありません','あれはコーヒーです','あれはコーヒーですじゃない'], answer:'あれはコーヒーじゃありません', explain:'否定是把 です 換成 じゃありません；です 後面不能再接 じゃない。', batch:1 },
  { id:'c01-q3', ch:1, type:'cloze', q:'きのうはにちようび___。', zh:'「昨天是星期日。」——過去肯定', answer:'でした', accepted:['でした'], explain:'名詞句過去肯定：です → でした。', batch:1 },
  { id:'c01-q4', ch:1, type:'cloze', q:'私は日本人じゃ___、台湾人です。', zh:'「我不是日本人，是台灣人。」', answer:'なくて', accepted:['なくて'], explain:'じゃない → じゃなくて：否定變 て形來連接下一句，「不是 A，而是 B」。', batch:1 },
  { id:'c01-q5', ch:1, type:'mc', q:'跟朋友講話（口語隨便），「我是學生」怎麼說？', choices:['わたしは学生だ','わたしは学生である','わたしは学生でした'], answer:'わたしは学生だ', explain:'語體階梯：です（禮貌）／だ（口語）／である（書面正式，小說論文才用）。でした 是過去式。', batch:1 },
  { id:'c01-q6', ch:1, type:'mc', q:'「そうじゃない！」的意思是？', choices:['不是那樣！／不對！','就是那樣！','是這樣嗎？'], answer:'不是那樣！／不對！', explain:'そう（那樣）＋じゃない（不是）＝口語反駁「才不是」「不對啦」。', batch:1 },
  { id:'c01-q7', ch:1, type:'cloze', q:'私は日本人___ありません。', zh:'正式書面的「我不是日本人」', answer:'では', accepted:['では'], explain:'じゃ 是 では 的口語縮略（de wa → ja）；正式書面用 ではありません。', batch:1 },
  { id:'c01-q8', ch:1, type:'cloze', q:'あれはみずじゃ___です。', zh:'「那不是水。」——丁寧口語（否定階梯第二階）', answer:'ない', accepted:['ない'], explain:'否定階梯：じゃない（口語）→じゃないです（丁寧口語）→じゃありません（丁寧）→ではありません（正式書面）。', batch:2 },
  { id:'c01-q9', ch:1, type:'mc', q:'《吾輩は猫である》的 である 是什麼語體？', choices:['書面正式體（小說、論文）','口語隨便體','日常禮貌體'], answer:'書面正式體（小說、論文）', explain:'語體階梯：だ（口語）／です（禮貌）／である（文語書面）。夏目漱石故意用老派的 吾輩＋である 製造幽默違和感。', batch:2 },
  { id:'c01-q10', ch:1, type:'cloze', q:'きのうはにちようびじゃ___。', zh:'「昨天不是星期日。」——名詞句的過去否定', answer:'ありませんでした', accepted:['ありませんでした'], explain:'四個形要成套記：です／じゃありません／でした／じゃありませんでした。過去否定是把 じゃありません 再加 でした。', batch:8 },
  { id:'c01-q11', ch:1, type:'mc', q:'否定的四個階梯，由最口語到最正式，順序是？', choices:['じゃない → じゃないです → じゃありません → ではありません','ではありません → じゃありません → じゃないです → じゃない','じゃありません → じゃない → ではありません → じゃないです'], answer:'じゃない → じゃないです → じゃありません → ではありません', explain:'じゃ 是 では 的口語縮略（de wa → ja），所以越接近 では 越正式；加上 です／ありません 則越禮貌。', batch:8 },
  { id:'c01-q12', ch:1, type:'mc', q:'「これはすしです」和「これはすしですか」差在哪？', choices:['加 か 變成疑問句「這是壽司嗎？」','加 か 變成否定句','兩句意思一樣，か 只是語氣詞'], answer:'加 か 變成疑問句「這是壽司嗎？」', explain:'日文不靠語序也不靠問號，句尾的 か 就是疑問記號——漏掉 か，「這是壽司嗎？」就變成「這是壽司。」', batch:8 },

  // ── 第 2 章 助詞比較：は vs を ──
  { id:'c02-q1', ch:2, type:'cloze', q:'これ___ください。', zh:'「請給我這個。」——決定點餐時', answer:'を', accepted:['を'], explain:'を 標記動作的對象，後面接動詞（ください）。點餐是「把這個給我」的動作。', batch:1 },
  { id:'c02-q2', ch:2, type:'cloze', q:'これ___なんですか。', zh:'「這是什麼？」——看菜單還不確定時', answer:'は', accepted:['は'], explain:'は 標記主題：「說到這個…它是什麼？」後面是描述判斷，不是動作。', batch:1 },
  { id:'c02-q3', ch:2, type:'cloze', q:'ねこはさかな___たべます。', zh:'「貓吃魚。」', answer:'を', accepted:['を'], explain:'さかな 是「吃」這個動作打到的對象，用 を；ねこ 是主題用 は。', batch:1 },
  { id:'c02-q5', ch:2, type:'mc', q:'「これを。」這句話——', choices:['不完整：を 後面必須有動詞','完整：意思是「這個」','完整：是疑問句'], answer:'不完整：を 後面必須有動詞', explain:'を 宣告「動作對象來了」，動詞卻沒出現，句子就沒講完（除非省略了大家都懂的 ください）。', batch:1 },
  { id:'c02-q6', ch:2, type:'cloze', q:'わたしはコーヒー___のみます。', zh:'「我喝咖啡。」', answer:'を', accepted:['を'], explain:'のみます（喝）是動詞，咖啡是它的對象：〜をのむ。', batch:1 },
  { id:'c02-q7', ch:2, type:'mc', q:'「我喜歡壽司」哪一句對？', choices:['すしがすきです','すしをすきです','すしはたべます'], answer:'すしがすきです', explain:'「喜歡」不是打得出去的動作，是狀態，所以不用 を、用 が（すき 的詞性第 4 章會正式介紹）。', batch:1 },
  { id:'c02-q8', ch:2, type:'cloze', q:'ねこ___みます。', zh:'「（我）看貓。」（みる＝看，本章動詞表）', answer:'を', accepted:['を'], explain:'みる 是動詞，貓是被看的對象：〜をみる。', batch:2 },
  { id:'c02-q9', ch:2, type:'cloze', q:'パン___かいます。', zh:'「（我）買麵包。」（かう＝買，本章動詞表）', answer:'を', accepted:['を'], explain:'かう 是動詞，麵包是買的對象：〜をかう。', batch:2 },
  { id:'c02-q10', ch:2, type:'mc', q:'「這是咖啡。」哪一句對？', choices:['これはコーヒーです','これをコーヒーです','これがたべます'], answer:'これはコーヒーです', explain:'「是」是判斷不是動作——沒有動詞就輪不到 を，主題用 は。', batch:2 },
  { id:'c02-q11', ch:2, type:'cloze', q:'いちご___ かいました。', zh:'「買了草莓。」（いちご＝草莓）', answer:'を', accepted:['を'], explain:'を 標記動作的對象——買的東西是いちご。動詞是 かいます，跟前面 パンをかいます 同一個結構。', batch:8 },
  { id:'c02-q12', ch:2, type:'cloze', q:'ゆうびんきょく___ どこですか。', zh:'「郵局在哪裡？」（ゆうびんきょく＝郵局）', answer:'は', accepted:['は'], explain:'這句沒有動作，只是把郵局提出來當話題問它在哪，所以用 は。を 只用在「對某物做某事」。', batch:8 },
  { id:'c02-q13', ch:2, type:'cloze', q:'まいあさ ぎゅうにゅう___ のみます。', zh:'「每天早上喝牛奶。」', answer:'を', accepted:['を'], explain:'喝的對象是牛奶，用 を。まいあさ 是時間詞，前面不必加助詞。', batch:8 },
  { id:'c02-q14', ch:2, type:'mc', q:'「あねはコーヒーをのみます」這句裡，は 和 を 各自在做什麼？', choices:['は 提出主題（姊姊），を 標記動作對象（咖啡）','は 標記動作對象，を 提出主題','兩個都在標記主詞，可以互換'], answer:'は 提出主題（姊姊），を 標記動作對象（咖啡）', explain:'一句話裡兩個助詞分工不同：は 說「我要談的是姊姊」，を 說「喝的東西是咖啡」。它們不是同一類，永遠不能互換。', batch:8 },

  // ── 第 3 章 い形容詞 ──
  { id:'c03-q1', ch:3, type:'cloze', q:'りょこうはたのしか___です。', zh:'「旅行（當時）很開心。」——過去肯定（りょこう＝旅行，第 6 章學過）', answer:'った', accepted:['った'], explain:'い形容詞過去肯定＝〜かった＋です：たのしい→たのしかったです。少了 た 是常見手誤——你錯過一次。', batch:1 },
  { id:'c03-q2', ch:3, type:'mc', q:'「今天不冷。」哪一句對？', choices:['きょうはさむくないです','きょうわさむくないです','きょうはさむいないです'], answer:'きょうはさむくないです', explain:'主題助詞「寫 は 念 wa」，寫成 わ 是錯的（你錯過一次）；い形容詞否定是砍 い 換 くない，不是直接加 ない。', batch:1 },
  { id:'c03-q3', ch:3, type:'cloze', q:'このすしはたか___です。', zh:'「這個壽司不貴。」——現在否定', answer:'くない', accepted:['くない'], explain:'い形容詞現在否定：砍掉 い、換上 くない。たかい→たかくないです。', batch:1 },
  { id:'c03-q4', ch:3, type:'mc', q:'「那部電影（當時）不好看。」いい 的過去否定是？', choices:['よくなかったです','いくなかったです','いいじゃありません'], answer:'よくなかったです', explain:'いい 是唯一例外：否定／過去要換用 よい 的活用。沒有「いくない」這種講法。', batch:1 },
  { id:'c03-q5', ch:3, type:'mc', q:'「好吃的壽司」怎麼說？', choices:['おいしいすし','おいしいなすし','おいしくすし'], answer:'おいしいすし', explain:'い形容詞修飾名詞時 い 完全不動，直接黏上去；加 な 的是な形容詞。', batch:1 },
  { id:'c03-q6', ch:3, type:'cloze', q:'テストはよか___です。', zh:'「考試（當時）考得不錯。」——いい 的過去肯定（テスト＝考試，第 5 章學過）', answer:'った', accepted:['った'], explain:'いい 的過去肯定用 よい 活用：よかったです。よかった 單獨用也是日常高頻的「太好了」。', batch:1 },
  { id:'c03-q8', ch:3, type:'cloze', q:'このやまはおおき___です。', zh:'「這座山不大。」——現在否定（やま＝山，本章「たかいやま」見過）', answer:'くない', accepted:['くない'], explain:'おおきい→おおきくないです：砍 い 換 くない，跟 たかい／さむい 同一條規則。', batch:2 },
  { id:'c03-q9', ch:3, type:'mc', q:'「舊的書」怎麼說？（ほん＝書）', choices:['ふるいほん','ふるほん','ふるいのほん'], answer:'ふるいほん', explain:'い形容詞修飾名詞直接黏上去，不砍 い 也不加 の：ふるい＋ほん。', batch:2 },
  { id:'c03-q7', ch:3, type:'mc', q:'「（那時）很好吃」說成「おいしいでした」——', choices:['錯：應為おいしかったです','對','錯：應為おいしいだった'], answer:'錯：應為おいしかったです', explain:'い形容詞自己活用、です 全程不動：動的是 おいしい→おいしかった，不是 です→でした。這是初學者最常見的錯句。', batch:1 },
  { id:'c03-q10', ch:3, type:'cloze', q:'このすしはやすか___です。', zh:'「這壽司（當時）很便宜。」——過去肯定', answer:'った', accepted:['った'], explain:'やすい→やすかったです，跟 たのしかった 同一條規則。', batch:2 },
  { id:'c03-q11', ch:3, type:'cloze', q:'このおちゃはあつ___です。', zh:'「這杯茶不燙。」——現在否定', answer:'くない', accepted:['くない'], explain:'あつい（熱）→あつくないです。', batch:2 },
  { id:'c03-q12', ch:3, type:'mc', q:'「冰的水」怎麼說？', choices:['つめたいみず','つめたみず','つめたいのみず'], answer:'つめたいみず', explain:'つめたい＝冷（觸感）；さむい 是天氣冷。修飾名詞直接黏，不砍 い 不加 の。', batch:2 },
  { id:'c03-q13', ch:3, type:'cloze', q:'テストはむずかし___です。', zh:'「考試（當時）不難。」——過去否定', answer:'くなかった', accepted:['くなかった'], explain:'むずかしい→むずかしくなかったです：く＋なかった（ない 的過去），見本章語源小節。', batch:2 },
  { id:'c03-q14', ch:3, type:'mc', q:'「小的貓」怎麼說？', choices:['ちいさいねこ','ちいさねこ','ちいさいのねこ'], answer:'ちいさいねこ', explain:'ちいさい 修飾名詞直接放前面：ちいさいねこ。', batch:2 },
  { id:'c03-q15', ch:3, type:'cloze', q:'このパンはあたらし___です。', zh:'「這麵包很新。」——現在肯定', answer:'い', accepted:['い'], explain:'現在肯定就是原形＋です：あたらしいです，什麼都不用變。', batch:2 },
  { id:'c03-q16', ch:3, type:'mc', q:'まずい 的意思是？', choices:['難吃','好吃','辣'], answer:'難吃', explain:'まずい＝難吃，おいしい 的反義詞（本章詞彙表）。', batch:2 },
  { id:'c03-q17', ch:3, type:'mc', q:'やさしい 在本章表裡有兩個意思，是哪兩個？', choices:['容易／溫柔','困難／嚴格','便宜／貴'], answer:'容易／溫柔', explain:'易しい（容易）與 優しい（溫柔）同音——漢字不同、意思都收在 やさしい 底下。', batch:2 },
  { id:'c03-q18', ch:3, type:'mc', q:'つめたい 和 さむい 都是「冷」，差別在哪？', choices:['つめたい 是摸到的冷（水、飲料），さむい 是天氣冷','つめたい 是天氣冷，さむい 是摸到的冷','兩個完全一樣，可以互換'], answer:'つめたい 是摸到的冷（水、飲料），さむい 是天氣冷', explain:'さむい（寒い）講的是身體感受到的氣溫；つめたい（冷たい）講的是觸覺——つめたいみず（冰水）不能說 さむいみず。', batch:8 },
  { id:'c03-q19', ch:3, type:'mc', q:'たかい 在本章表裡有兩個意思，是哪兩個？', choices:['高／貴','高／難','大／貴'], answer:'高／貴', explain:'たかい（高い）同時管高度與價格：たかいやま（高山）、たかいすし（貴的壽司）。反義也跟著分兩邊——高的反義是 ひくい，貴的反義是 やすい。', batch:8 },
  { id:'c03-q20', ch:3, type:'mc', q:'ふるい 的意思是？', choices:['舊','新','難'], answer:'舊', explain:'ふるい（古い）＝舊，反義是 あたらしい（新しい，新）。', batch:8 },
  { id:'c03-q21', ch:3, type:'mc', q:'下面哪一組是反義詞？', choices:['おおきい ⇄ ちいさい','おいしい ⇄ たのしい','あつい ⇄ たかい'], answer:'おおきい ⇄ ちいさい', explain:'大⇄小。おいしい（好吃）的反義是 まずい、たのしい（開心）沒有直接對到這裡的字；あつい（熱）的反義是 さむい。', batch:8 },
  { id:'c03-q22', ch:3, type:'mc', q:'本章表裡的 やすい 是什麼意思？', choices:['便宜','容易','難'], answer:'便宜', explain:'やすい（安い）＝便宜，反義是 たかい。「容易」是 やさしい（易しい）。另有一個接在動詞後面的 〜やすい 也是「容易」，那是第 20 項會正式介紹的句型，跟這裡的形容詞不同。', batch:8 },
  { id:'c03-q23', ch:3, type:'mc', q:'むずかしい 的反義詞是？', choices:['やさしい','たのしい','まずい'], answer:'やさしい', explain:'むずかしい（難しい，難）⇄ やさしい（易しい，容易）。やさしい 寫成「優しい」時是「溫柔」，同音兩義。', batch:8 },

  // ── 第 4 章 な形容詞 ──
  { id:'c04-q1', ch:4, type:'cloze', q:'きれい___まち', zh:'「漂亮的城市」', answer:'な', accepted:['な'], explain:'な形容詞修飾名詞時字尾加 な：きれいな＋まち。', batch:1 },
  { id:'c04-q2', ch:4, type:'mc', q:'下面哪一個是な形容詞？', choices:['きれい','たかい','おいしい'], answer:'きれい', explain:'きれい 的 い 是漢字「綺麗」的一部分，不是活用語尾——い 結尾不一定是い形容詞。', batch:1 },
  { id:'c04-q3', ch:4, type:'cloze', q:'まちはきれい___。', zh:'「城市很漂亮。」——作述語時', answer:'です', accepted:['です'], explain:'な形容詞作述語時不加 な，直接接 です；加 な 只在修飾名詞時。', batch:1 },
  { id:'c04-q4', ch:4, type:'cloze', q:'としょかんはしずか___。', zh:'「圖書館（當時）很安靜。」——過去肯定', answer:'でした', accepted:['でした'], explain:'な形容詞活用跟名詞句完全相同：過去肯定用 でした。', batch:1 },
  { id:'c04-q5', ch:4, type:'mc', q:'「喜歡的食物」怎麼說？', choices:['すきなたべもの','すきいたべもの','すきたべもの'], answer:'すきなたべもの', explain:'すき 是な形容詞，修飾名詞要加 な。', batch:1 },
  { id:'c04-q6', ch:4, type:'mc', q:'きらい（討厭）是什麼詞？', choices:['な形容詞','い形容詞','動詞'], answer:'な形容詞', explain:'跟 きれい 一樣，きらい 的 い 是漢字「嫌い」的一部分——要特別記的偽裝者。', batch:1 },
  { id:'c04-q7', ch:4, type:'cloze', q:'このまちはきれい___ありません。', zh:'「這個城市不漂亮。」', answer:'じゃ', accepted:['じゃ','では'], explain:'な形容詞否定跟名詞句一樣：〜じゃありません（正式書面 ではありません）。', batch:1 },
  { id:'c04-q8', ch:4, type:'cloze', q:'コンビニはべんり___。', zh:'「便利商店很方便。」——作述語', answer:'です', accepted:['です'], explain:'な形容詞作述語不加 な，直接接 です：べんりです。', batch:2 },
  { id:'c04-q9', ch:4, type:'mc', q:'「熱鬧的地方」怎麼說？', choices:['にぎやかなところ','にぎやかところ','にぎやかいところ'], answer:'にぎやかなところ', explain:'な形容詞修飾名詞要加 な：にぎやかな＋ところ。', batch:2 },
  { id:'c04-q10', ch:4, type:'cloze', q:'きのうはひま___。', zh:'「昨天（當時）很閒。」——過去肯定', answer:'でした', accepted:['でした'], explain:'ひま（空閒）是な形容詞，過去肯定跟名詞句一樣用 でした。', batch:2 },
  { id:'c04-q11', ch:4, type:'mc', q:'「不擅長」是哪個？', choices:['へた','じょうず','げんき'], answer:'へた', explain:'へた（下手）＝不擅長；じょうず（上手）＝擅長；げんき＝有精神。', batch:2 },
  { id:'c04-q12', ch:4, type:'cloze', q:'このすしはゆうめいじゃ___。', zh:'「這家壽司不有名。」——現在否定', answer:'ありません', accepted:['ありません'], explain:'ゆうめい 是い結尾的な形容詞（有名 的 い 是漢字一部分），否定照名詞句：じゃありません。', batch:2 },
  { id:'c04-q13', ch:4, type:'mc', q:'「有精神的貓」怎麼說？', choices:['げんきなねこ','げんきねこ','げんきいねこ'], answer:'げんきなねこ', explain:'げんき 是な形容詞，修飾名詞加 な。', batch:2 },
  { id:'c04-q14', ch:4, type:'mc', q:'たいへん 在本章表裡的意思是？', choices:['辛苦／很（程度副詞）','重要','方便'], answer:'辛苦／很（程度副詞）', explain:'たいへん（大変）既是「辛苦」也當程度副詞「很」用；「重要」是 たいせつ、「方便」是 べんり。', batch:2 },
  { id:'c04-q15', ch:4, type:'mc', q:'べんり 的反義詞是？', choices:['ふべん','たいへん','へた'], answer:'ふべん', explain:'便利⇄不便：べんり（方便）的反義是 ふべん（不方便）。', batch:2 },
  { id:'c04-q16', ch:4, type:'mc', q:'じょうず 的意思是？', choices:['擅長','不擅長','重要'], answer:'擅長', explain:'じょうず（上手）＝擅長，反義是 へた（下手）。「重要」是 たいせつ。', batch:8 },
  { id:'c04-q17', ch:4, type:'mc', q:'たいせつ 的意思是？', choices:['重要','方便','安靜'], answer:'重要', explain:'たいせつ（大切）＝重要、珍惜。「方便」是 べんり、「安靜」是 しずか。', batch:8 },
  { id:'c04-q18', ch:4, type:'mc', q:'しずか 的反義詞是？', choices:['にぎやか','ひま','きらい'], answer:'にぎやか', explain:'しずか（静か，安靜）⇄ にぎやか（賑やか，熱鬧）。ひま 是空閒、きらい 是討厭，都不是同一組。', batch:8 },
  { id:'c04-q19', ch:4, type:'mc', q:'すき 的反義詞是？', choices:['きらい','へた','ふべん'], answer:'きらい', explain:'すき（好き，喜歡）⇄ きらい（嫌い，討厭）。這兩個都是 い 結尾卻是な形容詞的偽裝者。', batch:8 },
  { id:'c04-q20', ch:4, type:'mc', q:'下面哪一個「不是」な形容詞？', choices:['たかい','きれい','ゆうめい'], answer:'たかい', explain:'たかい（高い）的 い 是活用語尾，是い形容詞。きれい（綺麗）、ゆうめい（有名）的 い 是漢字的一部分，兩個都是な形容詞。', batch:8 },
  { id:'c04-q21', ch:4, type:'mc', q:'ひま 的意思是？', choices:['空閒','重要','有名'], answer:'空閒', explain:'ひま（暇）＝空閒、有時間。ひまなとき＝有空的時候。「重要」是 たいせつ、「有名」是 ゆうめい。', batch:8 },

  // ── 第 5 章 あります／います ──
  { id:'c05-q1', ch:5, type:'mc', q:'「有貓。」哪一句對？', choices:['ねこがいます','ねこがあります','ねこにいます'], answer:'ねこがいます', explain:'有生命的（人、動物）用 います；存在的主語用 が 標記。', batch:1 },
  { id:'c05-q2', ch:5, type:'mc', q:'「有便利商店。」哪一句對？', choices:['コンビニがあります','コンビニがいます','コンビニはいます'], answer:'コンビニがあります', explain:'無生命的物（店、物品、事件）用 あります。', batch:1 },
  { id:'c05-q3', ch:5, type:'cloze', q:'ねこはテーブルのうえ___います。', zh:'「貓在桌子上。」', answer:'に', accepted:['に'], explain:'「X 在 Y」句型：場所後面用 に——X は 場所 に います／あります。', batch:1 },
  { id:'c05-q4', ch:5, type:'cloze', q:'じかんが___。', zh:'「沒有時間。」', answer:'ありません', accepted:['ありません'], explain:'時間是無生命，用 あります 的否定 ありません。', batch:1 },
  { id:'c05-q5', ch:5, type:'cloze', q:'テーブル___うえにあります。', zh:'「在桌子的上面。」——位置詞的接法', answer:'の', accepted:['の'], explain:'位置詞前面加 の：テーブルのうえ（桌子的上面）。', batch:1 },
  { id:'c05-q6', ch:5, type:'mc', q:'「明天有考試。」哪一句對？', choices:['あしたテストがあります','あしたテストがいます','あしたテストにあります'], answer:'あしたテストがあります', explain:'事件（考試、派對）也用 あります——這是 あります 的特殊用法。', batch:1 },
  { id:'c05-q7', ch:5, type:'cloze', q:'わたしはうちに___。', zh:'「我在家。」', answer:'います', accepted:['います'], explain:'人是有生命的，用 います：わたしはうちにいます。', batch:1 },
  { id:'c05-q8', ch:5, type:'cloze', q:'ねこはうちの___にいます。', zh:'「貓在家裡面。」（裡面）', answer:'なか', accepted:['なか'], explain:'なか＝裡面；位置詞前面加 の：うちのなか。', batch:2 },
  { id:'c05-q9', ch:5, type:'mc', q:'「便利商店在車站前面。」哪一句對？', choices:['コンビニはえきのまえにあります','コンビニはえきのまえにいます','コンビニがえきのまえです'], answer:'コンビニはえきのまえにあります', explain:'店是無生命用 あります；「X 在 Y」句型是 X は 場所 に あります。', batch:2 },
  { id:'c05-q10', ch:5, type:'cloze', q:'がくせいはえきの___にいます。', zh:'「學生在車站後面。」（後面）', answer:'うしろ', accepted:['うしろ'], explain:'うしろ＝後面；まえ⇄うしろ 成對記。', batch:2 },
  { id:'c05-q11', ch:5, type:'mc', q:'「旁邊（隔壁）」是哪個位置詞？', choices:['となり','うえ','あいだ'], answer:'となり', explain:'となり＝隔壁的旁邊；よこ＝側邊的旁邊；あいだ＝中間。', batch:2 },
  { id:'c05-q12', ch:5, type:'cloze', q:'コンビニはえきとうちの___にあります。', zh:'「便利商店在車站和家之間。」', answer:'あいだ', accepted:['あいだ'], explain:'A と B のあいだ＝A 和 B 之間。', batch:2 },
  { id:'c05-q13', ch:5, type:'cloze', q:'たまごはパンの___にあります。', zh:'「蛋在麵包下面。」（下面）', answer:'した', accepted:['した'], explain:'した＝下面；うえ⇄した 成對記。', batch:2 },
  { id:'c05-q14', ch:5, type:'mc', q:'「うえ」是什麼意思？', choices:['上面','下面','外面'], answer:'上面', explain:'うえ＝上面，跟 した（下面）成對記。テーブルのうえ＝桌上。', batch:4 },
  { id:'c05-q15', ch:5, type:'mc', q:'「した」是什麼意思？', choices:['下面','旁邊','裡面'], answer:'下面', explain:'した＝下面。うえ⇄した 是同一組；旁邊是 となり／よこ，裡面是 なか。', batch:4 },
  { id:'c05-q16', ch:5, type:'mc', q:'「そと」是什麼意思？', choices:['外面','裡面','中間'], answer:'外面', explain:'そと＝外面，跟 なか（裡面）成對。中間是 あいだ。', batch:4 },
  { id:'c05-q17', ch:5, type:'mc', q:'「まえ」是什麼意思？', choices:['前面','後面','上面'], answer:'前面', explain:'まえ＝前面，跟 うしろ（後面）成對。えきのまえ＝車站前。', batch:4 },
  { id:'c05-q18', ch:5, type:'mc', q:'「便利商店就在我家隔壁」，用哪個位置詞最貼切？', choices:['となり','よこ','あいだ'], answer:'となり', explain:'となり＝同類事物並排的「隔壁」（房子隔壁房子）；よこ 只是空間上的側邊（人站在桌子旁）；あいだ＝夾在兩者之間。', batch:4 },
  { id:'c05-q19', ch:5, type:'mc', q:'位置詞後面要接什麼才能修飾名詞？例：テーブル＿＿うえ', choices:['の','に','が'], answer:'の', explain:'名詞＋の＋位置詞：テーブルのうえ（桌子的上面）。に 是後面接 あります／います 時才用的場所助詞：テーブルのうえに あります。', batch:4 },
  { id:'c05-q20', ch:5, type:'mc', q:'在旅館櫃檯問「有房間嗎」，哪一句對？', choices:['へやは ありますか','へやは いますか','へやを ありますか'], answer:'へやは ありますか', explain:'房間是無生命，用 あります；います 只給人和動物。存在句的主語用 は 提出來或用 が 標記，不會用 を——を 是動作對象專用。', batch:9 },
  { id:'c05-q21', ch:5, type:'mc', q:'「有會說英文的人嗎」為什麼是 ひとは いますか，不是 ありますか？', choices:['對象是人，人和動物一律用 います','ありますか 比較不禮貌','兩個都可以，沒有差別'], answer:'對象是人，人和動物一律用 います', explain:'あります／います 的分界是有沒有生命，跟禮貌無關。這句還同時用到可能形（はなせる）與修飾名詞（はなせる＋ひと），兩個都學過了。', batch:9 },

  // ── 第 6 章 ます形（動詞禮貌體）──
  { id:'c06-q1', ch:6, type:'cloze', q:'のむ（喝）→ ___', zh:'寫出「喝」的禮貌體（現在肯定）', answer:'のみます', accepted:['のみます'], explain:'う動詞：語尾 u段 → i段＋ます。のむ（nomu）→ のみ（nomi）＋ます。', batch:1 },
  { id:'c06-q2', ch:6, type:'cloze', q:'たべ___。', zh:'「吃了。」——たべる 的過去肯定', answer:'ました', accepted:['ました'], explain:'る動詞直接去る套ます系列：たべる→たべました。', batch:1 },
  { id:'c06-q3', ch:6, type:'mc', q:'わかりませんでした 的意思是？', choices:['（當時）不懂','現在不懂','懂了'], answer:'（當時）不懂', explain:'ませんでした＝過去否定。現在不懂是 わかりません，懂了是 わかりました。', batch:1 },
  { id:'c06-q4', ch:6, type:'mc', q:'吃完飯離開餐廳時道謝，哪個較合適？', choices:['ありがとうございました','ありがとうございます','どういたしまして'], answer:'ありがとうございました', explain:'ございました＝事情已結束（感謝整頓飯）；ございます＝當下正在發生的服務；どういたしまして 是「不客氣」，那是店員回你的話。', batch:1 },
  { id:'c06-q5', ch:6, type:'cloze', q:'べんきょう___ます。', zh:'「學習。」——する動詞的禮貌體', answer:'し', accepted:['し'], explain:'名詞＋する 變動詞；する 的禮貌體是 します：べんきょうします。', batch:1 },
  { id:'c06-q6', ch:6, type:'mc', q:'みる（看）屬於哪一類動詞？', choices:['る動詞（一段）','う動詞（五段）','する動詞'], answer:'る動詞（一段）', explain:'みる 去る直接套ます：みます。一段動詞的變化最單純。', batch:1 },
  { id:'c06-q7', ch:6, type:'cloze', q:'たべ___。', zh:'「不吃。」——現在否定', answer:'ません', accepted:['ません'], explain:'ます系列固定變化：ます／ません／ました／ませんでした。現在否定是 ません。', batch:1 },
  { id:'c06-q8', ch:6, type:'cloze', q:'でんわ___ます。', zh:'「打電話。」——する動詞的禮貌體', answer:'し', accepted:['し'], explain:'でんわ＋する→でんわします，跟 べんきょうします 同一組。', batch:2 },
  { id:'c06-q9', ch:6, type:'cloze', q:'きのう、うんどう___ました。', zh:'「昨天運動了。」', answer:'し', accepted:['し'], explain:'うんどうする 的過去肯定：うんどうしました。', batch:2 },
  { id:'c06-q10', ch:6, type:'mc', q:'「（過去）沒有學習。」哪一句對？', choices:['べんきょうしませんでした','べんきょうしました','べんきょうしません'], answer:'べんきょうしませんでした', explain:'過去否定＝ませんでした；しました 是過去肯定、しません 是現在否定。', batch:2 },
  { id:'c06-q11', ch:6, type:'cloze', q:'ありがとうござい___。', zh:'離開餐廳時道謝（事情已結束）', answer:'ました', accepted:['ました'], explain:'事情結束用過去形 ございました；服務進行中才用 ございます。', batch:2 },
  { id:'c06-q12', ch:6, type:'mc', q:'かえる（帰る，回去）是哪一類動詞？', choices:['う動詞（五段）','る動詞（一段）','する動詞'], answer:'う動詞（五段）', explain:'かえる 以る結尾卻是う動詞，ます形是 かえります 不是 かえます。同類的偽裝者還有 はいる（進入）、はしる（跑）、きる（切）、しる（知道）——這幾個要背。', batch:8 },
  { id:'c06-q13', ch:6, type:'mc', q:'る 結尾的動詞，怎麼判斷是う動詞還是る動詞？', choices:['看 る 前面那個音：a／u／o 段是う動詞，i／e 段多半是る動詞','看漢字筆畫多寡','る 結尾的一律是る動詞'], answer:'看 る 前面那個音：a／u／o 段是う動詞，i／e 段多半是る動詞', explain:'のる（no-ru）、つくる（tsuku-ru）、わかる（waka-ru）前面是 a／u／o，都是う動詞；みる（mi-ru）、たべる（tabe-ru）前面是 i／e，是る動詞。例外是那幾個要背的偽裝者。', batch:8 },

  { id:'c07-q1', ch:7, type:'cloze', q:'のみます → ___', zh:'把「喝」的ます形改成て形', answer:'のんで', accepted:['のんで'], explain:'ます形語尾是 み／び／に 的う動詞走撥音便：變 んで。所以是 のんで，不是 のみて。', batch:2 },
  { id:'c07-q2', ch:7, type:'cloze', q:'いそぎます → ___', zh:'把「趕快」的ます形改成て形', answer:'いそいで', accepted:['いそいで'], explain:'ぎ 結尾變 いで（濁點要跟著留下）；き 結尾才是 いて。一點之差意思就走鐘。', batch:2 },
  { id:'c07-q3', ch:7, type:'mc', q:'「等一下」的て形哪一個對？', choices:['ちょっとまって','ちょっとまちて','ちょっとまつて'], answer:'ちょっとまって', explain:'まちます 是 ち 結尾的う動詞，走促音便變 って；まちて 是照字面接的錯誤，まつて 則是把促音的小っ寫成大つ。', batch:2 },
  { id:'c07-q4', ch:7, type:'cloze', q:'はなします → ___', zh:'把「說」的ます形改成て形', answer:'はなして', accepted:['はなして'], explain:'し 結尾的う動詞不音便，直接把ます換成て：はなして。する動詞的 して 也是同一個道理。', batch:2 },
  { id:'c07-q5', ch:7, type:'mc', q:'對要上場比賽的朋友說「がんばって！」，這是什麼語氣？', choices:['鼓勵對方加油','命令對方一定要做到','問對方要不要努力'], answer:'鼓勵對方加油', explain:'て形單獨用在口語裡是輕請求或鼓勵，不是命令形（命令形是 がんばれ）；要問對方就得加 ますか。', batch:2 },
  { id:'c07-q6', ch:7, type:'cloze', q:'たべます → ___', zh:'「吃」的て形（る動詞）', answer:'たべて', accepted:['たべて'], explain:'る動詞最單純：去ます直接＋て。たべて。', batch:2 },
  { id:'c07-q7', ch:7, type:'cloze', q:'ききます → ___', zh:'「聽」的て形（ききます＝聽，き 結尾）', answer:'きいて', accepted:['きいて'], explain:'き 結尾變 いて（不帶濁點）；ぎ 結尾才是 いで。', batch:2 },
  { id:'c07-q8', ch:7, type:'mc', q:'くる（來）的て形是？', choices:['きて','くて','こて'], answer:'きて', explain:'くる 是不規則動詞：きます→きて。', batch:2 },
  { id:'c07-q9', ch:7, type:'cloze', q:'べんきょうします → ___', zh:'「學習」的て形（する動詞）', answer:'べんきょうして', accepted:['べんきょうして'], explain:'する動詞照 します→して：べんきょうして。', batch:2 },
  { id:'c07-q10', ch:7, type:'mc', q:'いく（行く，去）的て形是？', choices:['いって','いいて','いきて'], answer:'いって', explain:'て形唯一的不規則：語尾是 く 卻不走「いて」，而是走「って」。いいて 是照 く→いて 規則硬套的錯誤答案，正因為看起來合理才最常錯。', batch:5 },
  { id:'c07-q11', ch:7, type:'cloze', q:'のる（搭乘）→ ___', zh:'う動詞的て形（のる＝搭乘）', answer:'のって', accepted:['のって'], explain:'原形語尾 う・つ・る 這一組都變 って：かう→かって、まつ→まって、のる→のって。', batch:5 },
  { id:'c07-q12', ch:7, type:'cloze', q:'あそぶ（玩）→ ___', zh:'う動詞的て形（あそぶ＝玩）', answer:'あそんで', accepted:['あそんで'], explain:'原形語尾 ぬ・ぶ・む 這一組都變 んで：しぬ→しんで、あそぶ→あそんで、のむ→のんで。', batch:5 },

  { id:'c08-q1', ch:8, type:'cloze', q:'ちょっと___ください。', zh:'「請等一下。」——まちます 的て形＋ください', answer:'まって', accepted:['まって'], explain:'まちます 是 ち 結尾的う動詞，て形走促音便變 まって（第 7 章）；接上 ください 就成了一般禮貌的請求。', batch:3 },
  { id:'c08-q2', ch:8, type:'cloze', q:'もういちど___ください。', zh:'「請再說一次。」（いいます＝說、もういちど＝再一次）', answer:'いって', accepted:['いって'], explain:'いいます 的ます形語尾是 い，跟 ち／り 同組走促音便：いって。＋ください＝請再說一次。', batch:3 },
  { id:'c08-q3', ch:8, type:'mc', q:'服務業場合（店員請客人稍候），最有禮貌的說法是？', choices:['ちょっとおまちください','ちょっとまってください','ちょっとまって'], answer:'ちょっとおまちください', explain:'禮貌三階：まって（口語，朋友）＜まってください（一般禮貌）＜おまちください（お〜ください，敬語，正式／服務業）。', batch:3 },
  { id:'c08-q4', ch:8, type:'mc', q:'「ゆっくりおねがいします」跟「〜てください」是什麼關係？', choices:['功能相同的替代說法，不用て形也能提要求','錯的，ゆっくり 後面一定要接動詞て形','比 てください 更沒禮貌，只能對朋友說'], answer:'功能相同的替代說法，不用て形也能提要求', explain:'おねがいします 直接接名詞或副詞（ゆっくり＝慢慢地）就能提要求，不需要動詞て形；效果跟 てください 一樣禮貌。', batch:3 },
  { id:'c08-q5', ch:8, type:'cloze', q:'これを___ください。', zh:'「請看這個。」（みます＝看，る動詞）', answer:'みて', accepted:['みて'], explain:'る動詞去ます直接加て：みて（第 7 章）。これ 是被看的對象所以用 を（第 2 章）。', batch:3 },
  { id:'c08-q6', ch:8, type:'mc', q:'「まって」跟「まってください」差在哪？', choices:['まって 較口語，對朋友用；まってください 用在一般禮貌場合','意思完全一樣，兩句可以隨便替換','まって 是命令，まってください 是疑問句'], answer:'まって 較口語，對朋友用；まってください 用在一般禮貌場合', explain:'て形單獨用是口語的輕請求（第 7 章的 まって、がんばって）；加了 ください 才是一般禮貌場合的說法。', batch:3 },
  { id:'c08-q7', ch:8, type:'cloze', q:'ゆっくり___ください。', zh:'「請慢慢說。」（はなします＝說話、ゆっくり＝慢慢地）', answer:'はなして', accepted:['はなして'], explain:'し 結尾的う動詞不音便，直接把ます換成て：はなして（第 7 章）＋ください。跟 ゆっくりおねがいします 意思一樣。', batch:3 },
  { id:'c08-q8', ch:8, type:'mc', q:'ください 本身原本的意思是？', choices:['請給我','請做','謝謝'], answer:'請給我', explain:'ください＝請給我。動詞て形＋ください 直譯是「請給我這個動作」，才引申成「請做⋯⋯」。', batch:3 },
  { id:'c08-q9', ch:8, type:'mc', q:'「請等一下」哪一句寫對了？', choices:['ちょっとまってください','ちょっとまちてください','ちょっとまつてください'], answer:'ちょっとまってください', explain:'まちて 是沒音便的錯寫；まつて 則是把促音的小 っ 寫成大 つ——這兩個是最容易寫錯的地方。', batch:3 },
  { id:'c08-q10', ch:8, type:'cloze', q:'みずを ___ ください。', zh:'「請喝水。」（のむ＝喝）', answer:'のんで', accepted:['のんで'], explain:'〜てください 前面要先變て形。のむ 屬 ぬ・ぶ・む 那一組，變 んで（第7章）——のみてください 是照字面接的錯。', batch:8 },
  { id:'c08-q11', ch:8, type:'mc', q:'「いそいでください」的原形是哪一個？', choices:['いそぐ','いそく','いそむ'], answer:'いそぐ', explain:'ぐ 結尾變 いで（帶濁點）：いそぐ→いそいで。く 結尾才是 いて，一點之差。', batch:8 },
  { id:'c08-q12', ch:8, type:'mc', q:'在店裡指著商品說「請給我這個」，哪一句最自然？', choices:['これをください','これをみてください','これをまってください'], answer:'これをください', explain:'ください 本身就是「請給我」，要東西時不必接て形。接て形是「請做某個動作」——みてください 是請對方看，まってください 是請對方等。', batch:8 },
  { id:'c08-q13', ch:8, type:'cloze', q:'りんごを よんこ ___。', zh:'「請給我四個蘋果。」', answer:'ください', accepted:['ください'], explain:'名詞＋を＋數量詞＋ください。數量詞夾在 を 和 ください 中間，不是放在名詞前面——不能說「よんこりんごを」。', batch:9 },
  { id:'c08-q14', ch:8, type:'mc', q:'「みずをのんでください」和「みずをください」差在哪？', choices:['前者請對方喝水，後者請對方給我水','兩句一樣，只是長短不同','前者比較有禮貌'], answer:'前者請對方喝水，後者請對方給我水', explain:'ください 前面接て形＝請做這個動作；接名詞＋を＝請給我這個東西。同一個 ください，前面接什麼決定意思完全不同。', batch:9 },
  { id:'c08-q15', ch:8, type:'mc', q:'「請給我一張票」哪一句對？', choices:['きっぷをいちまいください','いちまいきっぷをください','きっぷをくださいいちまい'], answer:'きっぷをいちまいください', explain:'語序固定為「名詞 を 數量詞 ください」。中文說「一張票」把數量放前面，日文不行——數量詞要放到 を 後面。', batch:9 },
  { id:'c08-q16', ch:8, type:'mc', q:'進店時店員說「いらっしゃいませ」，客人該怎麼回？', choices:['不用回，點頭或直接說要買什麼就好','要回一句いらっしゃいませ','要回こんにちは'], answer:'不用回，點頭或直接說要買什麼就好', explain:'いらっしゃいませ 是店員單向對客人說的迎賓語，不是「你好」，沒有對應的回話。學習者最常見的反應是想回一句，反而會讓場面尷尬。', batch:9 },
  { id:'c08-q17', ch:8, type:'mc', q:'「これをください」和「これをおねがいします」差在哪？', choices:['意思一樣，おねがいします 更客氣、更像把事情託付給對方','前者比較客氣','おねがいします 只能用在餐廳'], answer:'意思一樣，おねがいします 更客氣、更像把事情託付給對方', explain:'ください 直接清楚（指著商品說），おねがいします 姿態更低，遞證件、點餐、請人處理事情時用。三個層次：ください（給我東西）→ てください（做這個動作）→ おねがいします（這件事麻煩你）。', batch:9 },
  { id:'c08-q18', ch:8, type:'cloze', q:'えいごで ___。', zh:'「麻煩用英文（說）。」——不接動詞的萬用請求', answer:'おねがいします', accepted:['おねがいします'], explain:'おねがいします 後面不必接動詞，名詞加上去就能表達「這件事麻煩你」。不知道該用哪個動詞時，這句最好用。', batch:9 },
  { id:'c08-q19', ch:8, type:'mc', q:'這一章一直在用的 ください，是從哪裡來的？', choices:['くださる（尊敬語動詞）的命令形','くる（來）的命令形','沒有來源，本來就是一個固定詞'], answer:'くださる（尊敬語動詞）的命令形', explain:'くださる 是五個特殊尊敬動詞之一，ます形把り吃掉變 くださいます，命令形就是 ください。所以它跟 いらっしゃいませ 是同一個模子出來的。', batch:9 },
  { id:'c08-q20', ch:8, type:'mc', q:'「いらっしゃいませ」最後的 ませ 是什麼？', choices:['ます 的命令形','疑問的語尾','人名後面的敬稱'], answer:'ます 的命令形', explain:'いらっしゃる→いらっしゃいます→いらっしゃいませ。ませ 是 ます 的命令形，所以整句字面是「請您光臨」——一句禮貌的命令，這也是客人不用回話的原因。', batch:9 },
  { id:'c08-q21', ch:8, type:'mc', q:'「おまちください」和「おねがいします」的敬語框差在哪？', choices:['お〜ください 是請對方做（尊敬），お〜します 是我來做（謙讓）','兩個一樣，只是動詞不同','お〜します 比較不客氣'], answer:'お〜ください 是請對方做（尊敬），お〜します 是我來做（謙讓）', explain:'同一個 お＋動詞連用形 的框，結尾決定方向：ください 把動作交給對方並抬高對方，します 說自己做並放低自己。おねがいします 字面就是「我（低姿態地）向您提出請求」。', batch:9 },
  // ── 第 9 章 〜たい ──
  { id:'c09-q1', ch:9, type:'cloze', q:'わたしは すしが ___です。', zh:'「我想吃壽司。」——たべます 去掉 ます 再加 たい', answer:'たべたい', accepted:['たべたい'], explain:'ます形去掉 ます 剩下 たべ，接上 たい＝たべたい；禮貌場合後面再加 です。', batch:5 },
  { id:'c09-q2', ch:9, type:'cloze', q:'にほんへ ___です。', zh:'「想去日本。」（いきます＝去）', answer:'いきたい', accepted:['いきたい'], romaji:'nihon e ikitai desu.', explain:'いきます → いき＋たい。目的地的 へ 念成 e，而且不能換成 が。', batch:5 },
  { id:'c09-q3', ch:9, type:'mc', q:'「不想吃」哪一句對？', choices:['たべたくないです','たべたいません','たべませんたい'], answer:'たべたくないです', explain:'接上 たい 之後整串詞是い形容詞，否定走第 3 章的 くない 階梯：たい→たくない。たい 不是動詞，沒有 ません 這條路。', batch:5 },
  { id:'c09-q4', ch:9, type:'mc', q:'〜たい 的活用跟哪一類一樣？', choices:['い形容詞','な形容詞','動詞ます形'], answer:'い形容詞', explain:'たい 一接上去，整串詞就照第 3 章的い形容詞走：たくない／たかった／たくなかった。', batch:5 },
  { id:'c09-q5', ch:9, type:'cloze', q:'きのうは ケーキが ___です。', zh:'「昨天很想吃蛋糕。」——たべたい 的過去式', answer:'たべたかった', accepted:['たべたかった'], explain:'い形容詞的過去式是 かった：たべたい → たべたかった，後面再加 です。', batch:5 },
  { id:'c09-q6', ch:9, type:'mc', q:'「すし＿ たべたいです」的空格可以填什麼？', choices:['を 和 が 都可以，が 更強調「想吃的就是壽司」','只能填 を','只能填 に'], answer:'を 和 が 都可以，が 更強調「想吃的就是壽司」', explain:'想要／喜歡這類心情的對象可以改用 が 推成焦點（跟第 2 章的〜が すきです 同一個道理）；用 を 也完全正確。', batch:5 },
  { id:'c09-q7', ch:9, type:'mc', q:'「にほんが いきたいです」錯在哪裡？', choices:['移動的目的地要用 へ／に，不能換成 が','いきたい 應該寫成 いきたくない','にほん 後面不必加助詞'], answer:'移動的目的地要用 へ／に，不能換成 が', explain:'を⇄が 的替換只適用於「想要的對象」；目的地是方向，一律用 へ 或 に：にほんへ いきたいです。', batch:5 },
  { id:'c09-q8', ch:9, type:'mc', q:'「みずが のみたくなかったです」是什麼意思？', choices:['（那時）不想喝水','現在不想喝水','已經想喝水了'], answer:'（那時）不想喝水', explain:'たくなかった 是 たい 的過去否定（たい→たくない→たくなかった），講的是過去那個時候不想喝。', batch:5 },
  { id:'c09-q9', ch:9, type:'mc', q:'〜たい 可以用來講誰的願望？', choices:['自己的願望，或用疑問句問對方','任何人的願望都可以','只能講別人的願望'], answer:'自己的願望，或用疑問句問對方', explain:'たい 說的是說話者心裡的感覺，主語只能是自己；問對方用〜たいですか。別人的願望有另一套說法，之後再學。', batch:5 },
  { id:'c09-q10', ch:9, type:'mc', q:'「たべたいません」錯在哪裡？', choices:['たい 是い形容詞，否定要用 たくない','たい 後面本來就要接 ません','應該說 たべたいじゃない'], answer:'たい 是い形容詞，否定要用 たくない', explain:'〜たい 一旦接上去就整個變成い形容詞，活用跟 たかい・おいしい 一樣：たべたい → たべたくない → たべたくないです。ません 是動詞的否定，接不上い形容詞。', batch:8 },
  { id:'c09-q11', ch:9, type:'cloze', q:'のみます → ___です。', zh:'「想喝。」——ます形去ます＋たい', answer:'のみたい', accepted:['のみたい'], explain:'做法很機械：ます形去掉ます，剩下 のみ，加 たい。たべます→たべたい、いきます→いきたい 都同一招。', batch:8 },
  { id:'c09-q12', ch:9, type:'mc', q:'想問朋友「你想吃什麼？」哪一句對？', choices:['なにが たべたいですか','なにを たべたいます','かれは なにが たべたいです'], answer:'なにが たべたいですか', explain:'〜たい 只能講自己的願望，或用疑問句問對方；要講第三人稱（他想〜）得換別的說法。たべたいます 則是把い形容詞接上動詞語尾的錯。', batch:8 },
  // ── 第 10 章 〜が＋可能形（能力表達） ──
  { id:'c10-q1', ch:10, type:'cloze', q:'わたしはすし___たべられます。', zh:'「我能吃壽司。」——能力的對象要用哪個助詞？', answer:'が', accepted:['が'], explain:'能力的對象一律用 が。を 標記的是動作直接作用的東西（すしをたべます＝吃壽司），可能形要講的是「有沒有這個能力」，焦點標記用 が。', batch:6 },
  { id:'c10-q2', ch:10, type:'cloze', q:'のむ → ___', zh:'把「喝」（のむ）改成可能形，變出「能喝」', answer:'のめる', accepted:['のめる','のめます'], explain:'う動詞的可能形是語尾 u 段換成 e 段再加る：の「む」mu → の「め」る me-ru。同一條規則：かく→かける、はなす→はなせる。', batch:6 },
  { id:'c10-q3', ch:10, type:'mc', q:'「我會說英文。」哪一句對？', choices:['わたしはえいごがはなせます','わたしはえいごをはなします','わたしはえいごがはなします'], answer:'わたしはえいごがはなせます', romaji:'watashi wa eigo ga hanasemasu.', explain:'はなします 只是「說」（第 6 章的ます形），要講「會說」得先變可能形 はなせる 再加ます；能力的對象用 が 不用 を。', batch:6 },
  { id:'c10-q4', ch:10, type:'mc', q:'「能吃壽司」的正式寫法是哪一個？', choices:['すしがたべられます','すしがたべれます','すしがたべます'], answer:'すしがたべられます', explain:'たべる 是る動詞（第 6 章），可能形去る加られる → たべられる。口語常聽到的「たべれる」是把 ら 吃掉的說法，書面和考試要寫 たべられる；たべます 只是「吃」，沒有「能」的意思。', batch:6 },
  { id:'c10-q5', ch:10, type:'cloze', q:'みる → ___', zh:'把「看」（みる＝看）改成可能形，變出「能看」', answer:'みられる', accepted:['みられる','みられます'], explain:'みる 是る動詞，去る加られる → みられる，跟 たべる→たべられる 同一個模子。る動詞加られる、う動詞是 u→eru（のむ→のめる），兩類規則不同別混在一起。', batch:6 },
  { id:'c10-q6', ch:10, type:'mc', q:'「我懂日文。」哪一句對？', choices:['わたしはにほんごがわかります','わたしはにほんごがわかれます','わたしはにほんごをわかります'], answer:'わたしはにほんごがわかります', explain:'わかる（懂）本身就含「能夠」的意思，不用也不能再變可能形；「わかれます」不是它的可能形。對象一樣用 が，不用 を。', batch:6 },
  { id:'c10-q7', ch:10, type:'cloze', q:'わたし___えいごがはなせます。', zh:'「我會說英文。」——整句的主題要用哪個助詞？', answer:'は', accepted:['は'], romaji:'watashi wa eigo ga hanasemasu.', explain:'一句裡兩個角色分工：わたし 是整句主題用 は，えいご 是能力的對象用 が。兩個不能對調（沒有「わたしがえいごははなせます」這種說法）。', batch:6 },
  { id:'c10-q8', ch:10, type:'cloze', q:'かく → かける → ___', zh:'把「能寫」再變成禮貌體', answer:'かけます', accepted:['かけます'], explain:'可能形一律以る結尾，而且全部當る動詞活用：かける 去る加ます → かけます。所以 はなせる→はなせます、のめる→のめます 也是同一條規則。', batch:6 },
  { id:'c10-q9', ch:10, type:'mc', q:'「能游泳」怎麼說？（およぐ＝游泳）', choices:['およげます','およぎます','およがれます'], answer:'およげます', explain:'およぐ 是う動詞（語尾 ぐ），u→eru：およ「ぐ」gu → およ「げ」る ge-ru → およげます；およぎます 只是「游泳」沒有能力的意思。四類動詞的可能形一次記全：う動詞 u→eru、る動詞 去る加られる、する→できる、くる→こられる（後兩個不規則，先有印象就好）。', batch:6 },
  { id:'c10-q10', ch:10, type:'mc', q:'「たべれる」這種說法對嗎？', choices:['是ら抜き言葉，口語很常見，但正式場合要說 たべられる','完全正確，標準說法就是這個','不存在這種說法，一定是聽錯'], answer:'是ら抜き言葉，口語很常見，但正式場合要說 たべられる', explain:'る動詞的可能形是去る＋られる：たべる→たべられる。年輕人口語會把 ら 吃掉變 たべれる（ら抜き），聽得懂但考試與正式場合仍以 たべられる 為準。', batch:8 },
  { id:'c10-q11', ch:10, type:'mc', q:'「わかられます」對嗎？', choices:['不對，わかる 本身就含「能夠」的意思，不再變可能形','對，這是禮貌的可能形','對，但只用在書面'], answer:'不對，わかる 本身就含「能夠」的意思，不再變可能形', explain:'わかる 的語意本來就是「（能）理解」，再套一次可能形是重複。要說「我懂日文」就是 にほんごが わかります。', batch:8 },
  { id:'c10-q12', ch:10, type:'cloze', q:'する → ___', zh:'「する」的可能形（不規則）', answer:'できる', accepted:['できる'], explain:'する 的可能形不照規則，整個換成 できる：にほんごが できます＝會日文。くる 也不規則，可能形是 こられる。', batch:8 },
  // ── 第 11 章 修飾名詞：動詞句前置 ──
  { id:'c11-q1', ch:11, type:'cloze', q:'えいごがはなせる___', zh:'「能說英文的人」——被修飾的名詞放在哪裡？', answer:'ひと', accepted:['ひと','人'], romaji:'eigo ga hanaseru hito', explain:'日文的修飾語一律排在名詞前面：講完「えいごがはなせる」直接把 ひと 貼上去，中間什麼都不加。英文要靠 who（a person who can speak English），日文不需要這種字。', batch:7 },
  { id:'c11-q2', ch:11, type:'mc', q:'「昨天吃的壽司」哪一個對？', choices:['きのうたべたすし','きのうたべたのすし','きのうたべますすし'], answer:'きのうたべたすし', explain:'中文的「的」不能翻成 の——の 是名詞接名詞才用的（わたしのくるま），動詞句直接貼在名詞前面。たべた 是過去的說法（た形第 25 章會正式介紹，這裡先照本章例句記形狀）；ます形不能放進名詞前面修飾。', batch:7 },
  { id:'c11-q3', ch:11, type:'mc', q:'「會游泳的人」哪一個對？（およぐ＝游泳）', choices:['およげるひと','およげますひと','ひとがおよげる'], answer:'およげるひと', explain:'修飾名詞要用不帶ます的形（辭書形、可能形都可以），ます形只出現在句尾，所以沒有「およげますひと」。「ひとがおよげる」是一個句子（人會游泳），不是名詞組——名詞組的關鍵是被修飾的名詞排在最後面。', batch:7 },
  { id:'c11-q4', ch:11, type:'cloze', q:'ゆうめい___ひと', zh:'「有名的人」——な形容詞要怎麼接名詞？', answer:'な', accepted:['な'], explain:'な形容詞修飾名詞時要補上 な（第 4 章）：ゆうめいなひと。い形容詞不用補，直接接：おいしいごはん。', batch:7 },
  { id:'c11-q5', ch:11, type:'mc', q:'「好吃的飯」是哪一個？', choices:['おいしいごはん','ごはんおいしい','ごはんはおいしい'], answer:'おいしいごはん', romaji:'oishii gohan', explain:'い形容詞直接放在名詞前面。「ごはんはおいしい」是一個完整句子（飯很好吃），不是名詞組；名詞組的判準是被修飾的名詞一定排在最後面。', batch:7 },
  { id:'c11-q6', ch:11, type:'mc', q:'「能吃壽司的人」哪一個對？', choices:['すしがたべられるひと','すしがたべれるひと','すしがたべられますひと'], answer:'すしがたべられるひと', explain:'三個關卡一次過：能力的對象用 が（第 10 章）、可能形 たべられる 的 ら 不能吃掉（口語的「たべれる」是ら抜き，書面要寫全）、修飾名詞不能用ます形。', batch:7 },
  { id:'c11-q7', ch:11, type:'mc', q:'「這是我昨天吃的壽司。」哪一句對？', choices:['これはきのうたべたすしです','これはすしをきのうたべたです','これはきのうたべますすしです'], answer:'これはきのうたべたすしです', romaji:'kore wa kinou tabeta sushi desu.', explain:'修飾句「きのうたべた」整組放在 すし 前面，です 接在名詞後面收尾（第 1 章）。修飾語和它的名詞之間不能被別的東西切開。', batch:7 },
  { id:'c11-q8', ch:11, type:'mc', q:'「我的車」怎麼說？', choices:['わたしのくるま','わたしくるま','わたしなくるま'], answer:'わたしのくるま', explain:'修飾名詞的材料一共四種：名詞＋の（わたしのくるま）、い形容詞直接接（おいしいごはん）、な形容詞＋な（ゆうめいなひと）、動詞句直接接（えいごがはなせるひと）。只有名詞需要 の，動詞句放 の 就是被中文的「的」帶壞了。名詞接名詞的完整規則第 39 章會正式介紹。', batch:7 },
  { id:'c11-q9', ch:11, type:'mc', q:'「昨天吃的壽司」為什麼不能說 きのうたべたのすし？', choices:['動詞句修飾名詞時直接接上去，不加 の；の 只用在名詞修飾名詞','應該加 の 才對，這句沒錯','加不加 の 都可以'], answer:'動詞句修飾名詞時直接接上去，不加 の；の 只用在名詞修飾名詞', explain:'中文的「的」在日文分好幾種：名詞＋の（わたしのくるま）、い形容詞直接接（おいしいごはん）、な形容詞＋な（ゆうめいなひと）、動詞句直接接（きのうたべたすし）。把中文的「的」一律譯成 の 是最常見的錯。', batch:8 },
  { id:'c11-q10', ch:11, type:'mc', q:'下面哪一個是「完整句子」，而不是「名詞組」？', choices:['ごはんはおいしいです','おいしいごはん','きのうたべたすし'], answer:'ごはんはおいしいです', explain:'おいしいごはん、きのうたべたすし 都只是一團名詞（可以再當主語或受詞用）；加了 は…です 才成為說完一件事的句子。分不清這兩者，就會寫出沒有述語的半句話。', batch:8 },
  { id:'c11-q11', ch:11, type:'mc', q:'「有名的人」和「昨天來的人」，接名詞的方式差在哪？', choices:['ゆうめい 要加 な，きのうきた 直接接','兩個都要加 な','兩個都要加 の'], answer:'ゆうめい 要加 な，きのうきた 直接接', explain:'な形容詞修飾名詞才要 な（ゆうめいなひと）；動詞句直接放在名詞前面（きのうきたひと）。い形容詞也是直接接（おいしいごはん）。', batch:8 },
  { id:'c11-q12', ch:11, type:'mc', q:'「およげますひと」錯在哪裡？', choices:['修飾名詞要用辭書形 およげる，不能用ます形','應該說 およぎますひと','沒有錯，這樣說可以'], answer:'修飾名詞要用辭書形 およげる，不能用ます形', explain:'ます形只出現在句尾當述語（およげます。）。放到名詞前面修飾時一律用辭書形：およげるひと。這是把「禮貌體」誤當成萬用形的典型錯。', batch:8 },
  // ── 第 12 章 敬語入門：妳已經在用的那些 ──
  { id:'c12-q1', ch:12, type:'mc', q:'五個特殊尊敬動詞的ます形有什麼共同點？', choices:['都把 り 吃掉，變成 〜います','都變成 〜ります','都不加ます'], answer:'都把 り 吃掉，變成 〜います', explain:'いらっしゃる→いらっしゃいます（不是いらっしゃります）、くださる→くださいます、ござる→ございます、なさる→なさいます、おっしゃる→おっしゃいます。看到 〜ります 該有卻變成 〜います 的怪動詞，先想它是不是敬語。', batch:9 },
  { id:'c12-q2', ch:12, type:'mc', q:'「ありがとうございます」的 ございます 原本是哪個動詞？', choices:['ござる（ある 的尊敬形）','ごちそう','ございる'], answer:'ござる（ある 的尊敬形）', explain:'ござる 是 ある 的尊敬形，ます形把り吃掉成 ございます。所以這句字面是「有（這樣的好意）」，跟第5章的 あります 同源。', batch:9 },
  { id:'c12-q3', ch:12, type:'mc', q:'「おやすみなさい」的 なさい 是什麼？', choices:['なさる（する 的尊敬形）的命令形','名詞後綴','形容詞語尾'], answer:'なさる（する 的尊敬形）的命令形', explain:'なさる→なさいます→なさい。おやすみなさい、おかえりなさい 都是「お＋名詞＋なさい」的結構，跟 ください（くださる 的命令形）是平行的。', batch:9 },
  { id:'c12-q4', ch:12, type:'mc', q:'「おもちください」和「おもちします」差在哪？', choices:['前者請對方拿（尊敬），後者我來拿（謙讓）','前者比較客氣','兩個一樣'], answer:'前者請對方拿（尊敬），後者我來拿（謙讓）', explain:'同一個「お＋動詞連用形」的框，ください 把動作交給對方並抬高對方，します 說自己做並放低自己。這是整套敬語的骨架。', batch:9 },
  { id:'c12-q5', ch:12, type:'mc', q:'N5 階段對敬語的正確態度是？', choices:['把固定形當詞彙用熟，活用規則留到 N4','現在就要把尊敬語謙讓語的活用表全背起來','完全不用碰'], answer:'把固定形當詞彙用熟，活用規則留到 N4', explain:'尊敬語／謙讓語的系統性活用是 N4（みんなの日本語 II 第49–50課）。N5 只要求です・ます 的丁寧體，但 いらっしゃいませ、おねがいします、いただきます 這些固定形每天都會用到，先用熟即可。', batch:9 },
  // ── 第 13 章 〜になる（變成〜） ──
  { id:'c13-q1', ch:13, type:'cloze', q:'おとな___なります。', zh:'「會長大成人。」（おとな＝大人）', answer:'に', accepted:['に'], romaji:'otona ni narimasu.', explain:'名詞接 なる 一律用 に。整套規則只有三條：名詞＋に、な形容詞＋に、い形容詞把語尾 い 換成 く。前兩者沒有可以活用的語尾，只好借助詞 に 來接。', batch:10 },
  { id:'c13-q2', ch:13, type:'cloze', q:'さむ___なります。', zh:'「天氣會變冷。」（さむい＝冷）', answer:'く', accepted:['く'], romaji:'samuku narimasu.', explain:'い形容詞不能直接接 に——先把語尾 い 換成 く。「さむいになります」是最常見的錯。這個 く 就是第 3 章語源表的〜く（古典連用形，「…的狀態、…地」），跟 さむくない 的 く 是同一個。', batch:10 },
  { id:'c13-q3', ch:13, type:'mc', q:'「天氣變冷了。」哪一句對？（さむい＝冷）', choices:['さむくなりました','さむいになりました','さむくになりました'], answer:'さむくなりました', romaji:'samuku narimashita.', explain:'い形容詞走「い→く」這條，而且 く 後面直接接 なる，不再加 に。「くになる」是把兩條路混在一起。', batch:10 },
  { id:'c13-q4', ch:13, type:'cloze', q:'きれい___なりました。', zh:'「變漂亮了。」（きれい＝漂亮）', answer:'に', accepted:['に'], romaji:'kirei ni narimashita.', explain:'きれい 看起來像い形容詞，其實是な形容詞——第 4 章「容易誤判」表的三個（きれい／きらい／ゆうめい），它們的 い 是漢字的一部分不是語尾，所以不能改成く。說「きれくなりました」就是誤判了。', batch:10 },
  { id:'c13-q5', ch:13, type:'mc', q:'「ゆうめいになりました」跟「ゆうめいです」差在哪？', choices:['前者講的是變成有名（狀態改變了），後者只講現在有名','兩句意思一樣','前者比較禮貌'], answer:'前者講的是變成有名（狀態改變了），後者只講現在有名', explain:'なる 的重點永遠是「變化」：從一個狀態變到另一個狀態。です（第 1 章）只描述現在是什麼樣子，不含「本來不是」的意思。', batch:10 },
  { id:'c13-q6', ch:13, type:'cloze', q:'まいご___なりました。', zh:'「我迷路了。」（まいご＝迷路的人）', answer:'に', accepted:['に'], romaji:'maigo ni narimashita.', explain:'中文的「迷路了」是講一個動作結果，日文卻是「變成了迷路的人的狀態」——まいご 是名詞，所以走名詞＋に 那條。這組整個記起來最快。', batch:10 },
  { id:'c13-q7', ch:13, type:'mc', q:'「（身體）變好了。」いい 接 なる 要怎麼變？', choices:['よくなりました','いくなりました','いいになりました'], answer:'よくなりました', romaji:'yoku narimashita.', explain:'いい 活用時一律換回老字根 よ（第 3 章：いい→よかったです，不說「いかった」）。所以連用形是 よく，接 なる 就是 よくなります／よくなりました。', batch:10 },
  { id:'c13-q8', ch:13, type:'cloze', q:'せんせい___なりたいです。', zh:'「想成為老師。」', answer:'に', accepted:['に'], romaji:'sensei ni naritai desu.', explain:'名詞＋に＋なる；なりたい 是第 9 章的たい——なります 去掉ます 剩 なり，再加たい。「せんせいになりたいです」是自我介紹很好用的一句。', batch:10 },
  { id:'c13-q9', ch:13, type:'mc', q:'なる 的禮貌體（ます形）是哪一個？', choices:['なります','なます','なるます'], answer:'なります', explain:'なる 的ます形是把語尾 る 換成 り 再加ます＝なります，不是把る 直接拿掉。（為什麼有些る 結尾的動詞這樣變、有些不是，動詞分類第 44 章會正式介紹，現在先記住 なります 這個形。）', batch:10 },
  { id:'c13-q10', ch:13, type:'cloze', q:'げんき___なりました。', zh:'「（病好了）變有精神了。」', answer:'に', accepted:['に'], romaji:'genki ni narimashita.', explain:'げんき 是な形容詞（第 4 章表），接 なる 用 に。對照一下：「おげんきですか」問的是現在的狀態，「げんきになりました」講的是從不好變好的那個轉折。', batch:10 },
  { id:'c13-q11', ch:13, type:'mc', q:'「變便宜了。」哪一句對？（やすい＝便宜）', choices:['やすくなりました','やすいになりました','やすくになりました'], answer:'やすくなりました', romaji:'yasuku narimashita.', explain:'やすい 是い形容詞（第 3 章表）→ やすく＋なりました。三個選項剛好是三種常見寫法，只有把 い 換成 く 又不多加 に 的那個對。', batch:10 },
  { id:'c13-q12', ch:13, type:'cloze', q:'おおき___なりました。', zh:'「長大了／變大了。」（おおきい＝大）', answer:'く', accepted:['く'], romaji:'ookiku narimashita.', explain:'おおきい→おおきく＋なりました。判斷方法很機械：語尾是真的 い 語尾（可以換成 くない 的那種）就換く，換不了的（きれい、ゆうめい）就用 に。', batch:10 },
  { id:'c13-q13', ch:13, type:'mc', q:'接 なる 的三種材料，哪一組規則全對？', choices:['名詞＋に／な形容詞＋に／い形容詞 い→く','三種都用 に','三種都把語尾換成 く'], answer:'名詞＋に／な形容詞＋に／い形容詞 い→く', explain:'完整清單就這三條：せんせいになります（名詞）、きれいになります（な形容詞）、さむくなります（い形容詞）。只有い形容詞走 く，因為只有它有可以活用的語尾。', batch:10 },
  { id:'c13-q14', ch:13, type:'cloze', q:'はる___なりました。', zh:'「春天到了。」', answer:'に', accepted:['に'], romaji:'haru ni narimashita.', explain:'季節、時間也用〜になる：はる／なつ／あき／ふゆ 都可以。中文說「春天到了」，日文的想法是「變成春天了」——跟 まいごになりました 同一個腦袋。', batch:10 },
  { id:'c14-q1', ch:14, type:'cloze', q:'ここにすわ___もいいですか。', zh:'「可以坐這裡嗎？」（すわる＝坐）', answer:'って', accepted:['って'], romaji:'koko ni suwatte mo ii desu ka.', explain:'整個句型是「て形＋も＋いいですか」，所以第一步永遠是先把動詞變て形。すわる 語尾是る，走第 7 章「うつる→って」那一組：すわって。', batch:11 },
  { id:'c14-q2', ch:14, type:'cloze', q:'これをたべて___いいですか。', zh:'「這個我可以吃嗎？」——填中間那個助詞', answer:'も', accepted:['も'], romaji:'kore o tabete mo ii desu ka.', explain:'標準形是て形＋も＋いいですか，中間那個助詞就是 も。它是「就算」的意思，整句字面是「就算吃了也可以嗎」。口語裡常把 も 省掉說「たべていいですか」，但先把標準形記熟。', batch:11 },
  { id:'c14-q3', ch:14, type:'mc', q:'「我可以吃這個嗎？」哪一句對？', choices:['これをたべてもいいですか','これをたべますもいいですか','これをたべるもいいですか'], answer:'これをたべてもいいですか', romaji:'kore o tabete mo ii desu ka.', explain:'も 前面要的是て形，不是ます形也不是原形。把ます形直接塞進活用位置是第 10、11 章一直出現的同一個病（はなしますひと／およげますひと），這裡再犯一次就是 たべますも。', batch:11 },
  { id:'c14-q4', ch:14, type:'cloze', q:'トイレにい___もいいですか。', zh:'「我可以去廁所嗎？」（いく＝去）', answer:'って', accepted:['って'], romaji:'toire ni itte mo ii desu ka.', explain:'いく 是て形唯一的不規則——語尾是く 卻不走「く→いて」，而是 いって。第 7 章特別標出來的那一個例外，旅行時最常用到的也正是這句。', batch:11 },
  { id:'c14-q5', ch:14, type:'cloze', q:'おちゃをの___もいいですか。', zh:'「我可以喝茶嗎？」（のむ＝喝）', answer:'んで', accepted:['んで'], romaji:'ocha o nonde mo ii desu ka.', explain:'のむ 語尾是む，走「ぬぶむ→んで」那一組：のんで。濁點不要漏——のんて 是錯的。', batch:11 },
  { id:'c14-q6', ch:14, type:'cloze', q:'ここでべんきょう___もいいですか。', zh:'「可以在這裡讀書嗎？」', answer:'して', accepted:['して'], romaji:'koko de benkyou shite mo ii desu ka.', explain:'べんきょうする 是する動詞：する→して。所有「名詞＋する」的動詞都照這條走——りょこうして、うんどうして、さんぽして 全部一樣，是最好記的一類。', batch:11 },
  { id:'c14-q7', ch:14, type:'cloze', q:'これをみ___もいいですか。', zh:'「可以看一下這個嗎？」（みる＝看）', answer:'て', accepted:['て'], romaji:'kore o mite mo ii desu ka.', explain:'みる 語尾雖然是る，卻屬於第 7 章第二張表的る動詞：去る＋て＝みて，不是みって。要注意る 結尾的字不一定是る動詞——單字表裡的 かえる（回家）、はしる（跑）就走「うつる→って」那條，變成 かえって、はしって。怎麼分辨，第 44 章會正式講；現在先把 みる／たべる 這兩個記熟。', batch:11 },
  { id:'c14-q8', ch:14, type:'mc', q:'「可以買嗎？」（かう＝買）哪一個て形寫對了？', choices:['かってもいいですか','かつてもいいですか','かうてもいいですか'], answer:'かってもいいですか', romaji:'katte mo ii desu ka.', explain:'かう→かって，中間是小的っ（促音，停一拍再爆發）。寫成大的つ 就變成另一串音了；第 7、8 章的 まって 踩的是同一個坑。', batch:11 },
  { id:'c14-q9', ch:14, type:'cloze', q:'ここでたべて___いけません。', zh:'「這裡不可以吃東西。」——填一個假名，注意它念 wa', answer:'は', accepted:['は'], romaji:'koko de tabete wa ikemasen.', explain:'禁止的說法是「て形＋は＋いけません」。這個 は 是助詞，所以寫 は 卻念 wa（發音規則 7）——第 3 章妳把「きょうはさむくないです」的 は 寫成 わ，就是同一個陷阱。', batch:11 },
  { id:'c14-q10', ch:14, type:'mc', q:'「ここでおよいではいけません。」是什麼意思？', choices:['這裡不可以游泳','這裡可以游泳','請在這裡游泳'], answer:'這裡不可以游泳', explain:'およぐ→およいで（「ぐ→いで」，濁點跟著跑，第 7 章）。後面接 は＋いけません 就是禁止。看到句尾 〜てはいけません 一律讀成「不可以」，牌子上很常出現。', batch:11 },
  { id:'c14-q11', ch:14, type:'mc', q:'哪一組配對全對？', choices:['〜てもいいです＝可以／〜てはいけません＝不可以／〜てください＝請做','〜てもいいです＝請做／〜てはいけません＝可以／〜てください＝不可以','三個意思都一樣，只是禮貌度不同'], answer:'〜てもいいです＝可以／〜てはいけません＝不可以／〜てください＝請做', explain:'三個句型都用て形當底座，差別全在後面接什麼：も＋いい＝許可、は＋いけません＝禁止、ください＝請求（第 8 章）。先認出て形，再看尾巴決定意思。', batch:11 },
  { id:'c14-q12', ch:14, type:'mc', q:'「ちょっとまってください」和「ちょっとまってもいいですか」，動作分別是誰做？', choices:['前者請對方等，後者問我可不可以等','兩句都是我等','兩句都是對方等'], answer:'前者請對方等，後者問我可不可以等', explain:'同一個て形，方向相反：てください 是把動作交給對方（第 8 章），てもいいですか 是問對方「我做這個可以嗎」。想請店員等一下卻說成 まってもいいですか，意思就跑掉了。', batch:11 },
  { id:'c14-q13', ch:14, type:'mc', q:'在店裡想問「這個我可以吃嗎（請求允許）」，該用哪一句？', choices:['これをたべてもいいですか','これをたべられますか','これをたべたいですか'], answer:'これをたべてもいいですか', romaji:'kore o tabete mo ii desu ka.', explain:'たべられますか 是第 10 章的可能形，問的是「吃不吃得下、有沒有辦法吃」；たべたいですか 是第 9 章的たい，而且たい 講的是想不想，不是可不可以。要「許可」只有 てもいいですか。', batch:11 },
  { id:'c14-q14', ch:14, type:'mc', q:'別人問妳「ここにすわってもいいですか」，要回「可以，請坐」最自然是？', choices:['はい、どうぞ','はい、ください','いいえ、どうぞ'], answer:'はい、どうぞ', romaji:'hai, douzo.', explain:'許可的回答固定就是 はい、どうぞ。ください 是「請給我」，不能拿來給別人許可。想拒絕時日本人很少直說 だめです，多半是「すみません、ちょっと…」把話留一半。', batch:11 },
  { id:'c14-q15', ch:14, type:'cloze', q:'まどをあけ___もいいですか。', zh:'「可以開窗嗎？」（まど＝窗戶、あける＝打開）', answer:'て', accepted:['て'], romaji:'mado o akete mo ii desu ka.', explain:'あける 和 たべる、みる 同類，是る動詞：去る＋て＝あけて。順便和單字表裡的 ひらく 分一下：ひらく 偏書面（開會、開店那種「開」），日常「打開窗戶／門」用的是 あける。', batch:11 },

  // ── 第 15 章 もっと〜のはありますか ──
  { id:'c15-q1', ch:15, type:'cloze', q:'もっとおおきい___はありますか。', zh:'「有更大的嗎？」——填代替名詞的那一個字', answer:'の', accepted:['の'], romaji:'motto ookii no wa arimasu ka.', explain:'這個 の 就是中文的「的（東西）」——前面已經講過在看鞋子或衣服，就不必再把那個名詞重複一次，用 の 頂替。漏掉它變成「もっとおおきいはありますか」，形容詞後面懸空沒有東西可指。它的正式身分（準體助詞）第 39 章會介紹。', batch:12 },
  { id:'c15-q2', ch:15, type:'cloze', q:'___おおきいのはありますか。', zh:'「有更大的嗎？」——填「更加」那個字', answer:'もっと', accepted:['もっと'], romaji:'motto ookii no wa arimasu ka.', explain:'もっと＝更加，是副詞，位置固定在它要加強的那個形容詞正前面。不能放句尾，也不能塞到 の 後面。', batch:12 },
  { id:'c15-q3', ch:15, type:'mc', q:'「有更便宜的嗎？」哪一句對？', choices:['もっとやすいのはありますか','もっとやすいですのはありますか','もっとやすいのはいますか'], answer:'もっとやすいのはありますか', romaji:'motto yasui no wa arimasu ka.', explain:'兩個坑各躲一個：い形容詞直接接 の，中間不放 です（です 是收尾用的，句子還沒完不能先出現）；找的是東西不是人，所以用 あります 不是 います（第 5 章）。', batch:12 },
  { id:'c15-q4', ch:15, type:'cloze', q:'もっとやすいのは___ますか。', zh:'「有更便宜的嗎？」——東西該用哪個動詞？', answer:'あり', accepted:['あり'], romaji:'motto yasui no wa arimasu ka.', explain:'買的東西是無生命的，用 あります；います 只給人和動物（第 5 章）。在店裡問「有沒有貨」永遠是 ありますか——就算那個 の 指的是別的東西，也還是東西。', batch:12 },
  { id:'c15-q5', ch:15, type:'cloze', q:'もっとあたらしいの___ありますか。', zh:'「有更新的嗎？」——填助詞', answer:'は', accepted:['は','が'], romaji:'motto atarashii no wa arimasu ka.', explain:'第 5 章教過的旅行句形就是「〜は ありますか」（へやは ありますか）。填 が 文法上也通（が あります＝有〜），但手上正拿著一件在比較時，日本人習慣用 は 把「這一種」提出來對照。注意這個 は 是助詞，寫 は 念 wa（發音規則 7）。', batch:12 },
  { id:'c15-q6', ch:15, type:'mc', q:'「有更安靜的（房間）嗎？」哪一句對？（しずか＝安靜）', choices:['もっとしずかなのはありますか','もっとしずかのはありますか','もっとしずかいのはありますか'], answer:'もっとしずかなのはありますか', romaji:'motto shizuka na no wa arimasu ka.', explain:'しずか 是な形容詞，修飾後面的東西要加 な（第 4 章：しずかなところ）。の 頂替的正是那個被修飾的東西，所以一樣要 な。課文的四個例句剛好都是い形容詞，な形容詞這條是從第 4 章推過來的延伸。第三個選項是把它誤當成い形容詞。', batch:12 },
  { id:'c15-q7', ch:15, type:'mc', q:'想說「有更漂亮的嗎？」，もっと___のはありますか 的空格填什麼？', choices:['きれいな','きれい','きれいい'], answer:'きれいな', romaji:'kirei na', explain:'きれい 字尾雖然是 い，卻是な形容詞——第 4 章「容易誤判」表的三個（きれい／きらい／ゆうめい），它們的 い 是漢字的一部分不是活用語尾。所以走な形容詞那條，加 な 再接 の。', batch:12 },
  { id:'c15-q8', ch:15, type:'mc', q:'在店裡說「これはちょっとたかいです」，是什麼意思？', choices:['這個有點貴','這個有點高興','這個有點難'], answer:'這個有點貴', explain:'たかい（高い）一字兩義：高度的「高」和價格的「貴」，在店裡看價錢一律是貴。反義也跟著分兩邊——價格的反義是 やすい（便宜），高度的反義是 ひくい（低，之後會學）。加一個 ちょっと 是嫌貴時最不傷人的說法。', batch:12 },
  { id:'c15-q9', ch:15, type:'mc', q:'「やすい」是什麼意思？', choices:['便宜','容易','漂亮'], answer:'便宜', explain:'やすい（安い）＝便宜。第 3 章表上還有一個長得很像的 やさしい（易しい）＝容易／溫柔，中間差一個 さ，唸快了很容易混。要問「有更便宜的嗎」是 もっとやすいの。', batch:12 },
  { id:'c15-q10', ch:15, type:'mc', q:'「もっとふるいのはありますか」在問什麼？', choices:['有更舊的嗎','有更新的嗎','有更貴的嗎'], answer:'有更舊的嗎', explain:'ふるい（古い）＝舊，和 あたらしい（新しい）配成一對。逛古道具店、二手唱片行才會這樣問；買新品時要說的是 もっとあたらしいの。', batch:12 },
  { id:'c15-q11', ch:15, type:'mc', q:'「もっとちいさいのはありますか」的意思是？', choices:['有更小的嗎','有更大的嗎','有更多的嗎'], answer:'有更小的嗎', explain:'ちいさい（小さい）⇄ おおきい（大きい）是一對，尺寸不合時這兩句最常用。開頭的假名就是分辨點：ちいさい 是 ち、おおきい 是 お，在店裡說反了會拿到相反的尺寸。', batch:12 },
  { id:'c15-q12', ch:15, type:'cloze', q:'もっと___のはありますか。', zh:'「有更好的嗎？」（いい＝好）', answer:'いい', accepted:['いい'], romaji:'motto ii no wa arimasu ka.', explain:'いい 直接接 の 就好＝もっといいの。它只有在辭書形是 いい，一活用就換回老字根 よ（よくない／よかった，第 3 章），但這個句型不用活用，原樣放上去。', batch:12 },
  { id:'c15-q13', ch:15, type:'mc', q:'哪一句的語序對？', choices:['もっとおおきいのはありますか','おおきいもっとのはありますか','もっとのはおおきいありますか'], answer:'もっとおおきいのはありますか', romaji:'motto ookii no wa arimasu ka.', explain:'順序是固定的一串：もっと（更）→形容詞→の（的那個東西）→は→ありますか。もっと 是副詞，只能站在它要加強的形容詞前面；の 一定緊跟在形容詞後面，被它們夾住的位置不能插別的字。', batch:12 },
  { id:'c15-q14', ch:15, type:'mc', q:'妳問「もっとおおきいのはありますか」，店員回「はい、ございます」。意思是？', choices:['有，我拿給您','很抱歉沒有了','請您自己找'], answer:'有，我拿給您', explain:'ございます 是 あります 的鄭重說法（第 12 章五個特殊尊敬動詞裡的 ござる）。店員對客人幾乎都講它，所以聽到 ございます 就直接當 あります 理解。妳自己問的時候用 ありますか 就夠了。', batch:12 },
  { id:'c15-q15', ch:15, type:'cloze', q:'これはちょっとたかいです。もっと___のはありますか。', zh:'「這個有點貴。有更便宜的嗎？」', answer:'やすい', accepted:['やすい'], romaji:'kore wa chotto takai desu. motto yasui no wa arimasu ka.', explain:'這兩句是一組的：先用 ちょっとたかいです 委婉表示嫌貴，再用 もっとやすいの 把要求說出來。日本人很少單獨丟一句「たかい！」，前面加 ちょっと、後面補上要什麼，整段就順了。', batch:12 },
  { id:'c16-q1', ch:16, type:'cloze', q:'カード___はらえますか。', zh:'「可以用卡片付款嗎？」——填表示「用什麼方法」的助詞', answer:'で', accepted:['で'], romaji:'kaado de haraemasu ka.', explain:'で 標記手段——靠什麼方法做這件事。前面幾章沒有正式教過 で，這是它第一次以助詞身分出場；它還有別的用法，第 48 章會整組整理。最常見的錯是填 を：中文說「用卡片付」沒有助詞，手上又正把卡遞出去，很容易誤當成受詞。', batch:13 },
  { id:'c16-q2', ch:16, type:'mc', q:'「可以用現金付款嗎？」哪一句對？（げんきん＝現金）', choices:['げんきんではらえますか','げんきんをはらえますか','げんきんではらいますか'], answer:'げんきんではらえますか', romaji:'genkin de haraemasu ka.', explain:'兩個坑各躲一個：付款方式用 で 不用 を；問「可不可以」要用可能形 はらえます，はらいますか 只是問「你要付嗎」（第 6 章的ます形）。', batch:13 },
  { id:'c16-q3', ch:16, type:'cloze', q:'はらう → ___', zh:'把「付款」（はらう）改成可能形，變出「能付」', answer:'はらえる', accepted:['はらえる','はらえます'], romaji:'harau → haraeru', explain:'はらう 語尾是 う，走う動詞的 u→eru（第 10 章）：はら「う」u → はら「え」る e-ru，跟 のむ→のめる、かく→かける 同一條規則。可能形一律以る結尾、一律當る動詞活用，所以再加ます就是 はらえます。', batch:13 },
  { id:'c16-q4', ch:16, type:'mc', q:'店員問「はらいますか」，他在問什麼？', choices:['你要付嗎（單純問付不付）','付得了嗎（問可不可以用這個方式付）','已經付過了嗎'], answer:'你要付嗎（單純問付不付）', explain:'はらいます 是第 6 章的ます形（u 段換 i 段：はら「う」→はら「い」ます），只講動作本身；はらえます 才是第 10 章的可能形（u 段換 e 段＋る），才有「能不能」的意思。差一個假名意思差很多，這一章最容易錯的就是這裡。', batch:13 },
  { id:'c16-q5', ch:16, type:'cloze', q:'ICカードで___ますか。', zh:'「IC 卡可以付款嗎？」——填可能形那一截', answer:'はらえ', accepted:['はらえ'], romaji:'IC kaado de haraemasu ka.', explain:'はらえる 去る加ます → はらえます。填 はらい 就變成「你要付嗎」，問不到「可不可以」。ICカード 指的是像悠遊卡那樣的儲值卡，日本的 Suica、ICOCA 都屬於這一類。', batch:13 },
  { id:'c16-q6', ch:16, type:'mc', q:'店員說「すみません、カードではらえません」，意思是？', choices:['抱歉，不能刷卡','抱歉，卡片已經付過了','抱歉，卡片放在這裡'], answer:'抱歉，不能刷卡', explain:'可能形當る動詞活用，否定就把ます換成ません（第 6 章）：はらえます → はらえません＝付不了。聽到這一句就要改掏現金。', batch:13 },
  { id:'c16-q7', ch:16, type:'mc', q:'結帳時把卡片遞給店員，最自然的一句是？', choices:['カードでおねがいします','カードをください','カードははらいます'], answer:'カードでおねがいします', romaji:'kaado de onegaishimasu.', explain:'手段的 で 加上 おねがいします，就是「麻煩用卡片（結）」，日本店裡最常聽到的講法。カードをください 是「請給我卡片」（變成跟店員要一張卡）；第三句用ます形又配 は，兩邊都不對。', batch:13 },
  { id:'c16-q8', ch:16, type:'cloze', q:'バス___いきます。', zh:'「搭公車去。」——で 不只用在付款', answer:'で', accepted:['で'], romaji:'basu de ikimasu.', explain:'で 的核心意思是「靠什麼」：靠卡片付＝カードで、靠公車去＝バスで。所以這一章拿到的不只是一個結帳句，是一個助詞。いきます 是 いく 的ます形（第 6 章）。', batch:13 },
  { id:'c16-q9', ch:16, type:'cloze', q:'カード___つかえますか。', zh:'「卡片能用嗎？」（つかう＝使用）——填助詞', answer:'が', accepted:['が','は'], romaji:'kaado ga tsukaemasu ka.', explain:'同樣問刷卡，兩句的架構不一樣：はらう 問的是「用什麼方法付」，所以 カードで；つかう 的可能形 つかえる 問的是「卡片這個東西能不能用」，能力與可能的對象用 が（第 10 章）。填 は 也通（把卡片提出來當主題），を 兩邊都不對。', batch:13 },
  { id:'c16-q10', ch:16, type:'mc', q:'「げんきん」是什麼意思？', choices:['現金','卡片','收據'], answer:'現金', explain:'漢字就是「現金」。台語念 hiān-kim，「金」kim→きん 子音完全對上；「現」的 h 在台語對日語音読み常常變成 g（学 ha̍k→がく、行 hîng→ぎょう），所以 hiān→げん。整個詞 hiān-kim→げんきん 幾乎是直接搬過去。', batch:13 },
  { id:'c16-q11', ch:16, type:'mc', q:'漢字「現金」怎麼唸？', choices:['げんきん','けんきん','げんきむ'], answer:'げんきん', explain:'げん＋きん。第二個選項漏了濁點（け vs げ），第三個把 ん 寫成 む——ん 是日語唯一的獨立鼻音，不會寫成 む（發音規則 5）。章節頁上這個詞是用漢字寫的，先把讀音綁上去。', batch:13 },
  { id:'c16-q12', ch:16, type:'mc', q:'「はらう」是什麼意思？', choices:['付款','借出','使用'], answer:'付款', explain:'漢字寫「払う」，是う動詞。另外兩個選項都是第 6 章動詞表裡真的有的字：かす（借出）、つかう（使用）——三個都跟買東西有關，很容易混。', batch:13 },
  { id:'c16-q13', ch:16, type:'mc', q:'「ICカードではらえますか」在問什麼？', choices:['IC 卡可以付款嗎','IC 卡在哪裡買','IC 卡多少錢'], answer:'IC 卡可以付款嗎', explain:'拆開看：ICカード（方法）＋で（用）＋はらえますか（付不付得了）。要問後面兩個意思得換句型——問價錢是疑問詞那一批學過的 いくらですか。', batch:13 },
  { id:'c16-q14', ch:16, type:'cloze', q:'___ではらえますか。', zh:'「可以用卡片付款嗎？」（卡片是片假名外來語）', answer:'カード', accepted:['カード'], romaji:'kaado de haraemasu ka.', explain:'カード 來自英文 card，長音符號 ー 不能漏（カド 就不是 card 了）。付款方式擺句首、接 で、再接可能形，整個框換個字就能重用：げんきんで／ICカードで。', batch:13 },
  { id:'c16-q15', ch:16, type:'mc', q:'妳問「カードではらえますか」，店員回「すみません、げんきんでおねがいします」。妳應該？', choices:['拿現金出來付','再問一次能不能刷卡','把東西放回架上'], answer:'拿現金出來付', explain:'店員用的是跟妳一模一樣的框：手段的 で＋おねがいします，只是把方法換成 げんきん——「麻煩用現金」。日本很多小店和屋台到現在仍然只收現金，這一句會常聽到。', batch:13 },
  { id:'c17-q1', ch:17, type:'cloze', q:'いま、ごはんをたべて___。', zh:'「現在正在吃飯。」——填句尾', answer:'います', accepted:['います'], romaji:'ima, gohan o tabete imasu.', explain:'整個句型是「て形＋います」：たべる 是る動詞，去る＋て＝たべて（第 7 章），後面接 います 就是「正在吃」。這個 います 就是第 5 章講「有（人／動物）」的那個 います，在這裡變成句型的固定尾巴。', batch:14 },
  { id:'c17-q2', ch:17, type:'mc', q:'「現在正在吃飯。」哪一句對？', choices:['いま、ごはんをたべています','いま、ごはんをたべますています','いま、ごはんをたべるています'], answer:'いま、ごはんをたべています', romaji:'ima, gohan o tabete imasu.', explain:'います 前面要的是て形。把ます形塞進活用位置是第 10、11、14 章一直出現的同一個病（はなしますひと／たべますもいいですか），這裡再犯一次就是 たべますています。', batch:14 },
  { id:'c17-q3', ch:17, type:'mc', q:'「まどがあいています」是什麼意思？', choices:['窗戶開著','我正在打開窗戶','窗戶等一下會打開'], answer:'窗戶開著', romaji:'mado ga aite imasu.', explain:'あく 是「它自己開了」的那個開（批次 11）：あく→あいて＋います＝開了之後一直開著，是結果持續。批次 11 那時說「這個句型之後才正式教，先眼熟」，就是今天這一章。', batch:14 },
  { id:'c17-q4', ch:17, type:'mc', q:'「我正在把窗戶打開。」哪一句對？', choices:['まどをあけています','まどがあいています','まどがあけています'], answer:'まどをあけています', romaji:'mado o akete imasu.', explain:'有人動手開 → あける，對象用 を；あけています＝動作進行中。まどがあいています 講的是窗戶現在開著的狀態，沒有人在動手。第三句把 が 配給 あける，助詞和動詞對不上。同一個 ています 為什麼一個是「正在」一個是「狀態」，跟動詞本身有關，第 46 章自他動詞會正式整理。', batch:14 },
  { id:'c17-q5', ch:17, type:'cloze', q:'まどがあ___います。', zh:'「窗戶開著。」（あく＝開，自己開的那個）', answer:'いて', accepted:['いて'], romaji:'mado ga aite imasu.', explain:'あく 語尾是く，走第 7 章「く→いて」：あいて。不是 あって（那是 う・つ・る 那一組的變法），也不是 あくて。同一組的還有 あるく→あるいて、はたらく→はたらいて。', batch:14 },
  { id:'c17-q6', ch:17, type:'mc', q:'「これはこわれています」是什麼意思？', choices:['這個壞了（現在是壞的）','這個快要壞了','這個每天都會壞'], answer:'這個壞了（現在是壞的）', romaji:'kore wa kowarete imasu.', explain:'こわれる（壞掉）是一瞬間的事——壞的那一刻過了，留下來的是「壞著」的狀態，所以 こわれています 講的是結果持續。拿東西去店裡退換、跟旅館說設備有問題，用的都是這一句。', batch:14 },
  { id:'c17-q7', ch:17, type:'mc', q:'房間的暖氣現在是壞的，要跟櫃檯說哪一句？', choices:['だんぼうがこわれています','だんぼうがこわれます','だんぼうをこわれています'], answer:'だんぼうがこわれています', romaji:'danbou ga kowarete imasu.', explain:'こわれます 是「（將）壞掉」，講還沒發生的事；要說「現在是壞的」得用 こわれています。こわれる 是暖氣自己壞，跟 あく 一樣前面用 が 不用 を。', batch:14 },
  { id:'c17-q8', ch:17, type:'mc', q:'「だんぼうがこわれています」——暖氣不是生物，為什麼用 います 不用 あります？', choices:['這個 います 是て形後面的固定尾巴，跟主語是不是生物無關','暖氣在日文裡算生物','其實應該說 こわれてあります 才對'], answer:'這個 います 是て形後面的固定尾巴，跟主語是不是生物無關', explain:'第 5 章的 あります／います 是講「有」，那裡才要分生物與非生物。接在て形後面的 います 已經不是「有」的意思，是句型的一部分，所以窗戶、暖氣、人全都用 います。〜てあります 是另一個句型，意思不同，第 49 章會介紹。', batch:14 },
  { id:'c17-q9', ch:17, type:'cloze', q:'ともだちをま___います。', zh:'「我正在等朋友。」（まつ＝等）', answer:'って', accepted:['って'], romaji:'tomodachi o matte imasu.', explain:'まつ 語尾是つ，走「う・つ・る→って」：まって。中間是小的 っ（促音，停一拍），寫成大的 つ 就錯了——第 7、8 章的 ちょっとまってください 是同一個字。', batch:14 },
  { id:'c17-q10', ch:17, type:'cloze', q:'かいしゃではたら___います。', zh:'「在公司上班。」（はたらく＝工作）', answer:'いて', accepted:['いて'], romaji:'kaisha de hataraite imasu.', explain:'はたらく→はたらいて（く→いて，批次 11）。注意意思：這句不是「此刻正在工作」，而是「在公司上班（這陣子一直是這樣）」——ています 還有講長期狀態、習慣的用法，grammar.md 的表只列了進行與結果兩種，這是第三種。', batch:14 },
  { id:'c17-q11', ch:17, type:'mc', q:'「まいにちうんどうしています」是什麼意思？', choices:['每天都有在運動（習慣）','現在這一刻正在運動','每天都想運動'], answer:'每天都有在運動（習慣）', romaji:'mainichi undou shite imasu.', explain:'前面有 まいにち（每天），ています 就不是「此刻正在」，而是反覆在做、已經成為習慣的事。想運動 是第 9 章的 うんどうしたい。うんどうする 是する動詞，て形 して。', batch:14 },
  { id:'c17-q12', ch:17, type:'cloze', q:'いま、べんきょう___います。', zh:'「現在正在讀書。」', answer:'して', accepted:['して'], romaji:'ima, benkyou shite imasu.', explain:'べんきょうする 是する動詞：する→して，再接 います。いま（現在）是「動作進行中」最明顯的訊號。', batch:14 },
  { id:'c17-q13', ch:17, type:'cloze', q:'「たべていますか。」「いいえ、たべて___。」', zh:'「在吃嗎？」「沒有，沒在吃。」——填否定的句尾', answer:'いません', accepted:['いません'], romaji:'tabete imasu ka. iie, tabete imasen.', explain:'て形不動，只把尾巴 います 照第 6 章的規則變：疑問加 か、否定 ます→ません。所以 たべています／たべていますか／たべていません，前半截永遠是 たべて。', batch:14 },
  { id:'c17-q14', ch:17, type:'mc', q:'同樣是 まって，哪一組配對全對？', choices:['まっています＝正在等／まってください＝請等／まってもいいですか＝我可以等嗎','まっています＝請等／まってください＝正在等／まってもいいですか＝我可以等嗎','三句意思都一樣，只是禮貌度不同'], answer:'まっています＝正在等／まってください＝請等／まってもいいですか＝我可以等嗎', explain:'三個句型共用同一個て形底座，意思全看尾巴：います＝正在（本章）、ください＝請對方做（第 8 章）、もいいですか＝問許可（第 14 章）。先認出て形，再看尾巴。', batch:14 },
  { id:'c17-q15', ch:17, type:'mc', q:'章節頁上的「壊れています」，壊れる 怎麼唸？', choices:['こわれる','こまれる','かいれる'], answer:'こわれる', explain:'壊れる 念 こわれる，單獨當動詞用的是訓読み。かい 是它的音読み，只出現在漢語詞裡（破壊 はかい），不能拿來念這個動詞——跟批次 11 講的「動詞念訓読み，進複合詞才念音読み」同一條分流規則。', batch:14 },
  { id:'c17-q16', ch:17, type:'mc', q:'「暖房」怎麼唸？', choices:['だんぼう','だんほう','なんぼう'], answer:'だんぼう', explain:'暖 だん＋房 ぼう。房 的濁點不能漏，冷氣 冷房 れいぼう 是同一個 ぼう，兩個是反義的一對。台語「暖」loán 的 -n 韻尾在日語收成 ん，跟 洗 sián→せん 同一條規則。', batch:14 },
  { id:'c18-q1', ch:18, type:'cloze', q:'えき___なんぷんですか。', zh:'「到車站要幾分鐘？」——填「到〜」', answer:'まで', accepted:['まで'], romaji:'eki made nanpun desu ka.', explain:'まで＝到〜為止，標出終點。這是它第一次正式出現：目的地＋まで＋問句，問句的尾巴可以換成 なんぷん（幾分鐘）／なんじかん（幾小時）／いくら（多少錢）。', batch:15 },
  { id:'c18-q2', ch:18, type:'mc', q:'「到車站要幾分鐘？」哪一句對？', choices:['えきまでなんぷんですか','えきなんぷんですか','えきまでなんじですか'], answer:'えきまでなんぷんですか', romaji:'eki made nanpun desu ka.', explain:'漏掉 まで，句子就變成「車站是幾分鐘？」，沒有「到」的意思。なんじ 是「幾點」（問時刻），不是「要多久」。', batch:15 },
  { id:'c18-q3', ch:18, type:'mc', q:'「くうこうまでいくらですか」是什麼意思？', choices:['到機場要多少錢？','到機場要幾分鐘？','機場在哪裡？'], answer:'到機場要多少錢？', romaji:'kuukou made ikura desu ka.', explain:'いくら（多少錢）是已學的疑問詞。同一個「〜まで」框，只換尾巴：なんぷん 問時間、いくら 問價錢——坐計程車（タクシー）前最常用。問地點是 どこですか。', batch:15 },
  { id:'c18-q4', ch:18, type:'mc', q:'「到機場要幾個小時？」哪一句對？', choices:['くうこうまでなんじかんですか','くうこうまでなんじですか','くうこうまでなんぷんですか'], answer:'くうこうまでなんじかんですか', romaji:'kuukou made nanjikan desu ka.', explain:'なんじ＝幾點（時刻），なんじかん＝幾個小時（長度）。じかん（時間）就是「一段時間」，加上去才是在問要花多久；なんぷん 則是問幾分鐘。', batch:15 },
  { id:'c18-q5', ch:18, type:'cloze', q:'ある___えきまでなんぷんですか。', zh:'「走路到車站要幾分鐘？」（あるく＝走路）', answer:'いて', accepted:['いて'], romaji:'aruite eki made nanpun desu ka.', explain:'あるく 是う動詞，く→いて（第 7 章音便），あるいて＝「用走的」。前面加上怎麼去，問的就是那種方式要花幾分鐘；搭車則用第 16 章的 で：バスでえきまでなんぷんですか。', batch:15 },
  { id:'c18-q6', ch:18, type:'mc', q:'「何分」怎麼唸？', choices:['なんぷん','なんふん','なにぷん'], answer:'なんぷん', romaji:'nanpun', explain:'何 接計數詞念 なん（批次 3，同 なんじ／なんさい）。分 在 ん 後面由 ふ 變成 ぷ，所以是 なんぷん——跟 さんぷん 同一條規則。', batch:15 },
  { id:'c18-q7', ch:18, type:'cloze', q:'えきまで___です。', zh:'「到車站一分鐘。」——用平假名寫「1分」', answer:'いっぷん', accepted:['いっぷん'], romaji:'eki made ippun desu.', explain:'いち＋ふん→いっぷん：ち縮成促音 っ，ふ 回到古音 ぷ。跟 一本 いっぽん、一匹 いっぴき（批次 4）一模一樣的變化——分 也是 は行開頭的計數詞。', batch:15 },
  { id:'c18-q8', ch:18, type:'mc', q:'「2分」怎麼唸？', choices:['にふん','にぷん','にぶん'], answer:'にふん', romaji:'nifun', explain:'2、5、7、9 後面不變，老老實實念 ふん：にふん、ごふん、ななふん、きゅうふん。只有 1、3、4、6、8、10 會變成 ぷん。', batch:15 },
  { id:'c18-q9', ch:18, type:'mc', q:'「3分」怎麼唸？', choices:['さんぷん','さんぶん','さんふん'], answer:'さんぷん', romaji:'sanpun', explain:'陷阱在這裡：3 本 是 さんぼん（濁化 b），3 分 卻是 さんぷん（半濁 p）。分 在 3 和 4 後面都走 ぷ，不能照搬 本 的表。', batch:15 },
  { id:'c18-q10', ch:18, type:'cloze', q:'えきまで___です。', zh:'「到車站四分鐘。」——用平假名寫「4分」', answer:'よんぷん', accepted:['よんぷん'], romaji:'eki made yonpun desu.', explain:'接計數詞的 4 用 よん（批次 4），ん 後面 ふ→ぷ，所以 よんぷん。別跟 よじ（四點）搞混——四點的 よ 沒有 ん，四分鐘的 よん 有。', batch:15 },
  { id:'c18-q11', ch:18, type:'cloze', q:'バスでくうこうまで___です。', zh:'「搭公車到機場六分鐘。」——用平假名寫「6分」', answer:'ろっぷん', accepted:['ろっぷん'], romaji:'basu de kuukou made roppun desu.', explain:'ろく＋ふん→ろっぷん：く縮成 っ、ふ變 ぷ，同 ろっぽん／ろっぴき。完整表：いっぷん・にふん・さんぷん・よんぷん・ごふん・ろっぷん・ななふん・はっぷん・きゅうふん・じゅっぷん。', batch:15 },
  { id:'c18-q12', ch:18, type:'mc', q:'「8分」和「10分」怎麼唸？', choices:['はっぷん・じゅっぷん','はちふん・じゅうふん','はっふん・じゅっふん'], answer:'はっぷん・じゅっぷん', romaji:'happun, juppun', explain:'8 和 10 跟 1、6 同一組：縮成促音 っ，後面的 ふ 一定跟著變 ぷ（っ 後面不會接 ふ，所以 はっふん 不存在）。はちふん 口語偶爾聽得到，但標準是 はっぷん。', batch:15 },
  { id:'c18-q13', ch:18, type:'mc', q:'「えきまでごふんです」是什麼意思？', choices:['到車站五分鐘','到車站五點','到車站五個小時'], answer:'到車站五分鐘', romaji:'eki made gofun desu.', explain:'ふん／ぷん＝分鐘，じ＝點，じかん＝小時。三個尾巴長得不像，聽到 ふん 就是分鐘。', batch:15 },
  { id:'c18-q14', ch:18, type:'mc', q:'「よじかん」是什麼意思？', choices:['四個小時','四點','四分鐘'], answer:'四個小時', romaji:'yojikan', explain:'〜じかん 是小時數。4 的讀法跟時刻一樣縮成 よ（よじ＝四點，批次 4 的例外），所以四小時是 よじかん 不是 よんじかん；四點則是 よじ。9 小時同理念 くじかん。', batch:15 },
  { id:'c18-q15', ch:18, type:'mc', q:'想問「搭電車到機場要多少錢」，哪一句對？', choices:['でんしゃでくうこうまでいくらですか','でんしゃをくうこうまでいくらですか','でんしゃでくうこういくらですか'], answer:'でんしゃでくうこうまでいくらですか', romaji:'densha de kuukou made ikura desu ka.', explain:'兩個助詞各管一件事：で 標「靠什麼」（第 16 章，でんしゃで），まで 標終點。交通工具不用 を；漏了 まで 就沒有「到機場」。', batch:15 },
  // ── 第 19 章 〜を預けられますか ──
  { id:'c19-q1', ch:19, type:'cloze', q:'にもつ___あずけられますか。', zh:'「可以寄放行李嗎？」（にもつ＝行李、あずける＝寄放）——填助詞', answer:'を', accepted:['を','が'], romaji:'nimotsu o azukeraremasu ka.', explain:'第 10 章講「能力」（わたしはすしがたべられます）時對象用 が；本章是向櫃台問「可不可以做這件事」，日本人日常多用 を，兩種都對，本章的例句就用 を。要分的話：講自己會不會 → が；請對方讓你做 → を。', batch:16 },
  { id:'c19-q2', ch:19, type:'mc', q:'「可以寄放行李嗎？」哪一句對？（にもつ＝行李）', choices:['にもつをあずけられますか','にもつをあずけますか','にもつをあずけれますか'], answer:'にもつをあずけられますか', romaji:'nimotsu o azukeraremasu ka.', explain:'あずけますか 是ます形（第 6 章）的問句，意思是「你要寄放嗎」，沒有「可以」。あずけれますか 是把 ら 吃掉的口語（第 10 章的ら抜き），正式要說 あずけられますか。', batch:16 },
  { id:'c19-q3', ch:19, type:'cloze', q:'あずける → ___', zh:'把「寄放」（あずける）改成可能形，變出「能寄放」', answer:'あずけられる', accepted:['あずけられる','あずけられます'], explain:'あずける 語尾是 ける，是る動詞：去る＋られる → あずけられる，跟第 10 章的 たべる→たべられる、みる→みられる 同一個模子。要禮貌就再去る＋ます → あずけられます。', batch:16 },
  { id:'c19-q4', ch:19, type:'mc', q:'第 16 章是「はらえますか」、這一章是「あずけられますか」——同樣是可能形，為什麼一個 え、一個 られ？', choices:['はらう 是う動詞（u→e＋る），あずける 是る動詞（去る＋られる），兩類規則不同','兩種寫法可以互換，看語氣','あずける 比較長，所以要多加 ら'], answer:'はらう 是う動詞（u→e＋る），あずける 是る動詞（去る＋られる），兩類規則不同', explain:'可能形看動詞類別：う動詞把語尾 u 段換 e 段再加る（はら「う」→はら「え」る），る動詞把る去掉加られる（あずけ「る」→あずけ「られる」）。第 10 章這兩條規則在這一章各出現一次，別混用。', batch:16 },
  { id:'c19-q5', ch:19, type:'mc', q:'「にもつをあずけれますか」這種說法對嗎？', choices:['是ら抜き，口語聽得到，正式要說 あずけられますか','完全正確，標準說法就是這個','不對，可能形應該是 あずけえますか'], answer:'是ら抜き，口語聽得到，正式要說 あずけられますか', explain:'る動詞的可能形是去る＋られる，あずけれる 少了 ら，就是第 10 章講過的ら抜き言葉（たべれる 同一個病）。あずけえる 是把う動詞的規則套到る動詞上，不存在。', batch:16 },
  { id:'c19-q6', ch:19, type:'cloze', q:'にもつをあずけ___もいいですか。', zh:'「我可以寄放行李嗎？」——用第 14 章的句型，填て形的尾巴', answer:'て', accepted:['て'], romaji:'nimotsu o azukete mo ii desu ka.', explain:'あずける 是る動詞，て形去る＋て → あずけて（第 7 章），接上第 14 章的 もいいですか 就是另一條路。兩句都實用：あずけられますか 問「能不能」，あずけてもいいですか 問「可不可以讓我」，後者語感更軟。', batch:16 },
  { id:'c19-q7', ch:19, type:'mc', q:'「にもつをあずけます」是什麼意思？（にもつ＝行李）', choices:['我要寄放行李（陳述，沒有問能不能）','可以寄放行李嗎','行李已經寄放好了'], answer:'我要寄放行李（陳述，沒有問能不能）', romaji:'nimotsu o azukemasu.', explain:'あずけます 只是ます形，「寄放」這個動作本身；要問「能不能」得先變可能形再加ます。這跟第 16 章 はらいます（付）vs はらえます（能付）是同一組對比。「已經寄放好了」是第 17 章的 ています 那一類，不是這句。', batch:16 },
  { id:'c19-q8', ch:19, type:'mc', q:'「にもつ」是什麼意思？', choices:['行李','外套','貴重品'], answer:'行李', explain:'荷物 にもつ：荷 に＝背上的貨、物 もつ。批次 7 講過 物 有三讀——もの（たべもの）、ぶつ（どうぶつ）、もつ（にもつ）——這個字走 もつ。外套是 コート（批次 30），貴重品是 きちょうひん（本章）。', batch:16 },
  { id:'c19-q9', ch:19, type:'cloze', q:'貴重品 → ___', zh:'「貴重品」（＝貴重物品，護照、錢包這類）怎麼唸？——填假名', answer:'きちょうひん', accepted:['きちょうひん'], romaji:'kichouhin', explain:'貴 き・重 ちょう・品 ひん，三個都是音読み。台語對照：重 tiōng → ちょう（t→ch、ong→ou）、品 phín → ひん（は行古代念 p，發音規則 2）。寫法陷阱：ちょ 是小 ょ 合讀、後面還有長音 う，きちょひん／きちようひん 都不對。', batch:16 },
  { id:'c19-q10', ch:19, type:'cloze', q:'荷物 → ___', zh:'「荷物」（＝行李）怎麼唸？——填假名', answer:'にもつ', accepted:['にもつ'], romaji:'nimotsu', explain:'荷 に 是訓読み、物 もつ 是音読み（批次 7 的三讀之一），一個字兩種讀法混搭。把 物 唸成 もの（にもの）是最常見的錯。', batch:16 },
  { id:'c19-q11', ch:19, type:'cloze', q:'___をあずけられますか。', zh:'「可以寄放外套嗎？」——填「外套」', answer:'コート', accepted:['コート'], romaji:'kooto o azukeraremasu ka.', explain:'コート 是批次 30 的外來語（coat），把句型框裡的「物品」換掉就好：にもつ／コート／きちょうひん 都放同一個位置。這一章的三個例句就是這三樣東西。', batch:16 },
  { id:'c19-q12', ch:19, type:'mc', q:'妳問「にもつをあずけられますか」，櫃台回「はい、おあずかりします」。這句是什麼意思？', choices:['好的，我來替您保管','好的，請您自己寄放','不好意思，不能寄放'], answer:'好的，我來替您保管', explain:'お＋あずかり＋します 是第 12 章「お〜します」的謙讓框，說自己要做並放低自己。あずかる（＝保管，對方收下）跟本章的 あずける（寄放，我交出去）是一對，一個字之差方向相反：妳 あずける、櫃台 あずかる。', batch:16 },
  { id:'c19-q13', ch:19, type:'cloze', q:'きちょうひんをあずけられます___。', zh:'「可以寄放貴重品嗎？」——填句尾', answer:'か', accepted:['か'], romaji:'kichouhin o azukeraremasu ka.', explain:'問句的尾巴是 か，少了它整句變成「可以寄放貴重品」的陳述。第 1 章就錯過一次 ですか 漏 か，這章的 ますか 是同一個位置。', batch:16 },
  { id:'c19-q14', ch:19, type:'mc', q:'「可以（把行李）寄放到三點嗎？」哪一句對？', choices:['さんじまでにもつをあずけられますか','さんじににもつをあずけられますか','さんじでにもつをあずけられますか'], answer:'さんじまでにもつをあずけられますか', romaji:'sanji made nimotsu o azukeraremasu ka.', explain:'まで 是第 18 章的「到〜為止」，終點可以是地點（えきまで）也可以是時間（さんじまで）。さんじに 標的是動作發生的時刻（單字課例句看過的 ろくじに おきます，第 48 章才正式介紹），問的不是能放到幾點；で 是第 16 章「靠什麼」，放在時間上不對。', batch:16 },
  { id:'c19-q15', ch:19, type:'mc', q:'到飯店櫃台想寄放行李，最自然的一句是？（にもつ＝行李）', choices:['すみません、にもつをあずけられますか','すみません、にもつをあずけてください','すみません、にもつをください'], answer:'すみません、にもつをあずけられますか', romaji:'sumimasen, nimotsu o azukeraremasu ka.', explain:'方向要對：あずけてください 是第 8 章「請你做」，變成叫櫃台去寄放行李；にもつをください 是「請給我行李」，變成跟櫃台要東西。要做動作的是自己，就用可能形問（本章）或 てもいいですか（第 14 章），跟第 14 章講的 てください／てもいいですか 方向對比是同一件事。', batch:16 },
  { id:'c19-q16', ch:19, type:'mc', q:'「きちょうひん」是什麼意思？', choices:['貴重品','行李','鑰匙'], answer:'貴重品', explain:'貴重品 きちょうひん＝貴重物品（護照、錢包、手錶這類），飯店與溫泉的置物櫃告示上很常見這三個漢字。行李是 にもつ（本章），鑰匙是 かぎ（已學）。', batch:16 },
  { id:'c20-q1', ch:20, type:'cloze', q:'がくせいも、しゃかいじん___います。', zh:'「學生也有、社會人士也有。」（しゃかいじん＝出社會工作的人）——填助詞', answer:'も', accepted:['も'], romaji:'gakusei mo, shakaijin mo imasu.', explain:'も 接在名詞後面就是「也」；同一句裡重複兩次（Aも、Bも）就變成「不管是 A 還是 B 都」。這一章 grammar.md 的第三個例句 学生も、社会人も 就是這個形，後面的動詞照第 5 章——人用います。', batch:17 },
  { id:'c20-q2', ch:20, type:'mc', q:'「わたしはもがくせいです」這句哪裡錯了？', choices:['も 已經把 は 擠掉了，只要說 わたしもがくせいです','沒有錯，は 跟 も 可以連在一起用','順序反了，應該說 わたしもはがくせいです'], answer:'も 已經把 は 擠掉了，只要說 わたしもがくせいです', explain:'一個名詞後面只掛一個助詞。も 一進來，は／が／を 這三個就要退出去：わたしは→わたしも、ビールが→ビールも、すしを→すしも。（に／で 那一類反而留得下來，變成 にも／でも，第 48 章整理助詞時會再講。）', batch:17 },
  { id:'c20-q3', ch:20, type:'cloze', q:'ビールも ワイン___のみません。', zh:'「啤酒也不喝，葡萄酒也不喝。」——填助詞', answer:'も', accepted:['も'], romaji:'biiru mo wain mo nomimasen.', explain:'も〜も 後面換成否定，整句就從「都…」變成「都不…」，兩樣一起被否定。のみません 是第 6 章 のむ 的ます形否定。', batch:17 },
  { id:'c20-q4', ch:20, type:'mc', q:'「ビールもワインものみません」是什麼意思？', choices:['啤酒跟葡萄酒兩種都不喝','只有啤酒不喝，葡萄酒喝','兩種都喝'], answer:'啤酒跟葡萄酒兩種都不喝', explain:'A も B も＋否定＝兩邊一起否定，沒有「只有…不」的意思。要講「只有啤酒不喝」得換成對比的 は（ビールはのみません），那是第 2 章 は 的對比功能。', batch:17 },
  { id:'c20-q5', ch:20, type:'cloze', q:'すし___たべます。', zh:'「（除了剛才說的，）壽司也吃。」——填助詞，注意 を 要不要留著', answer:'も', accepted:['も'], romaji:'sushi mo tabemasu.', explain:'も 直接取代 を，すしをも／すしはも 都不對。第 2 章的 を 標的是動作對象，這裡對象沒變，只是多了「也」的意思，位置就讓給 も。', batch:17 },
  { id:'c20-q6', ch:20, type:'mc', q:'「壽司也吃」哪一句對？', choices:['すしもたべます','すしをもたべます','すしはもたべます'], answer:'すしもたべます', explain:'助詞不疊。も 只跟 に／で 那類共存（にも／でも），碰到 は／が／を 一律把它們換掉。', batch:17 },
  { id:'c20-q7', ch:20, type:'cloze', q:'ビール___すきなひとも、そうでないひとも。', zh:'「喜歡啤酒的人也好，不喜歡的人也好。」——填「喜歡」的對象該用的助詞', answer:'が', accepted:['が'], romaji:'biiru ga suki na hito mo, sou de nai hito mo.', explain:'すき 的對象用 が，不能用 を（×ビールをすき）——跟第 10 章「能力的對象用 が」（すしがたべられます）是同一個習慣。中文的「喜歡啤酒」很像動詞帶受詞，但日文的 すき 是な形容詞，所以配 が。', batch:17 },
  { id:'c20-q8', ch:20, type:'cloze', q:'ビールがすきなひとも、___ひとも います。', zh:'「喜歡啤酒的人也好，不喜歡的人也好，都有。」——填代替「不是那樣」的說法', answer:'そうでない', accepted:['そうでない','そうじゃない'], romaji:'biiru ga suki na hito mo, sou de nai hito mo imasu.', explain:'そう 把前面講過的敘述（すき）整包接住，そうでない＝「不是那樣」，免得再寫一次 すきじゃない。でない 是第 1 章 じゃない 的書面版，同一個否定，口語說 そうじゃないひと 也通。', batch:17 },
  { id:'c20-q9', ch:20, type:'mc', q:'「そうでないひと」裡的「そう」代替的是什麼？', choices:['前面剛講過的敘述（すき），不必重複一次','那個人的名字','動詞的ます形'], answer:'前面剛講過的敘述（すき），不必重複一次', explain:'ビールがすきなひとも、そうでないひとも＝「喜歡啤酒的人也好，（喜歡啤酒這件事）不是那樣的人也好」。そう 就是中文「那樣」，讓句子不必把長長的敘述再抄一遍。', batch:17 },
  { id:'c20-q10', ch:20, type:'cloze', q:'からい___がすきなひとも、そうでないひとも。', zh:'「喜歡辣的（東西）的人也好，不喜歡的人也好。」——填代替「東西」的那個字', answer:'の', accepted:['の'], romaji:'karai no ga suki na hito mo, sou de nai hito mo.', explain:'の 可以代替沒講明的名詞（＝「的東西」），跟第 15 章 もっとおおきいのはありますか 的 の 同一個用法。からいのがすき＝喜歡辣的東西；後面接 ひと 時 の 就不用了（からいものがすきなひと 也對，只是長）。', batch:17 },
  { id:'c20-q11', ch:20, type:'mc', q:'「すきなひと」為什麼 すき 後面要加一個 な？', choices:['すき 是な形容詞，修飾名詞要補 な','すき 是い形容詞，加 な 是例外','所有形容詞修飾名詞都要加 な'], answer:'すき 是な形容詞，修飾名詞要補 な', explain:'第 4 章的規則：な形容詞修飾名詞補一個 な（しずかなところ／きれいなひと），い形容詞直接接（からいもの）。すき 字尾雖然沒有 い，它就是な形容詞；整串 ビールがすきなひと 靠的是第 11 章的修飾名詞語序——說明放前面，被修飾的名詞放最後。', batch:17 },
  { id:'c20-q12', ch:20, type:'cloze', q:'社会人 → ___', zh:'「社会人」（＝出社會工作的人）怎麼唸？——填假名', answer:'しゃかいじん', accepted:['しゃかいじん'], romaji:'shakaijin', explain:'社 しゃ・会 かい・人 じん，三個都是音読み。台語對照：社 siā → しゃ、会 kài → かい、人 jîn → じん。しゃ 是小 ゃ 合讀（發音規則 3），寫成 しやかいじん 不對。', batch:17 },
  { id:'c20-q13', ch:20, type:'mc', q:'「しゃかいじん」是什麼意思？', choices:['出社會工作的人','學生','老人'], answer:'出社會工作的人', explain:'社会人 是日文特有的說法：畢業進公司上班就叫 社会人，跟 がくせい（學生）正好成一對——這一章的例句 がくせいも、しゃかいじんも 就是靠這一對把所有人都包進去。', batch:17 },
  { id:'c20-q14', ch:20, type:'cloze', q:'辛い → ___', zh:'「辛い」（＝辣的）怎麼唸？——填假名', answer:'からい', accepted:['からい'], romaji:'karai', explain:'辛い 唸 からい 是訓読み。同一個漢字還能唸 つらい（＝難受、辛苦），意思差很遠：講食物就是 からい。這一章的例句 辛いのが好きな人 用的是前者。', batch:17 },
  { id:'c20-q15', ch:20, type:'mc', q:'「がくせいもいます」跟「がくせいもしゃかいじんもいます」差在哪裡？', choices:['前者只點名學生「也有」，後者兩種人都點名，語氣變成「都有」','意思完全一樣','後者是錯的，も 不能在一句裡出現兩次'], answer:'前者只點名學生「也有」，後者兩種人都點名，語氣變成「都有」', explain:'一個 も＝「也」（還有別人，只是沒講出來）；兩個 も＝「A 也 B 也」，把範圍攤開講成「都」。這一章練的就是後者這個成對的形。', batch:17 },
  { id:'c20-q16', ch:20, type:'mc', q:'第 14 章「たべてもいいですか」裡的 も，跟這一章的 も 是同一個嗎？', choices:['是同一個 も，但它接在て形後面，意思變成「即使…也」','是完全不同的兩個字，只是長得一樣','是同一個用法，てもいいですか 也是在講「て形也…」'], answer:'是同一個 も，但它接在て形後面，意思變成「即使…也」', explain:'助詞 も 只有一個：接名詞時是「也／都」（本章），接て形時變成讓步的「即使…也」（たべても＝就算吃了），所以 てもいいですか 原本是「即使做了也可以嗎」凝固成的問法。〜ても 這條第 49 章會正式講。', batch:17 },
  { id:'c21-q1', ch:21, type:'cloze', q:'この コーヒーは ___やすいです。', zh:'「這杯咖啡很順口（容易入口）。」——填「のむ」該變成的形', answer:'のみ', accepted:['のみ'], romaji:'kono koohii wa nomiyasui desu.', explain:'やすい 接的是**ます形語幹**：のむ 是う動詞，ます形 のみます，把 ます 拿掉剩 のみ。這一格跟第 9 章 たい 完全同一個位置（のみたい／のみやすい），記住一個等於記住兩個。', batch:18 },
  { id:'c21-q2', ch:21, type:'cloze', q:'この すしは ___やすいです。', zh:'「這個壽司很好入口。」——填「たべる」該變成的形', answer:'たべ', accepted:['たべ'], romaji:'kono sushi wa tabeyasui desu.', explain:'る動詞只要把 る 拿掉：たべる→たべます→たべ。う動詞要先 u 段換 i 段（のむ→のみ），兩條路第 6 章都學過——やすい／にくい 用的就是那個語幹，不必另外背。', batch:18 },
  { id:'c21-q3', ch:21, type:'mc', q:'「容易吃」哪一句對？', choices:['たべやすい','たべるやすい','たべますやすい'], answer:'たべやすい', explain:'接的是語幹，不是原形也不是整串ます形。×たべるやすい／×たべますやすい 正是第 10、11、14、17 章一路犯過的同一個病：要掛尾巴，先把動詞拆到語幹。', batch:18 },
  { id:'c21-q4', ch:21, type:'cloze', q:'この くすりは のみ___です。', zh:'「這個藥很難入口。」——填「難以〜」的那個字', answer:'にくい', accepted:['にくい'], romaji:'kono kusuri wa nominikui desu.', explain:'にくい 是 やすい 的反面，接法一模一樣（語幹＋にくい）。它講的是「這個動作做起來不容易」，不是「討厭」——のみにくい 是難以下嚥，不是不想喝。', batch:18 },
  { id:'c21-q5', ch:21, type:'mc', q:'「のみにくい」是什麼意思？', choices:['難以入口、不好喝下去','不想喝','喝不到、不能喝'], answer:'難以入口、不好喝下去', explain:'三個尾巴長得像但講不同的事：にくい＝做起來費力（本章）、たくない＝不想做（第 9 章 のみたくない）、可能形否定＝辦不到（第 10 章 のめません）。', batch:18 },
  { id:'c21-q6', ch:21, type:'cloze', q:'この ペンは つかいやす___ないです。', zh:'「這支筆不好用（用起來不順手）。」——填空，把 やすい 變成否定', answer:'く', accepted:['く'], romaji:'kono pen wa tsukaiyasukunai desu.', explain:'接上 やすい 之後，整串就是**い形容詞**，否定走第 3 章的階梯：やすい→やすくない。跟第 9 章 たい 同一套（たべたくない／つかいやすくない）。つかう 是う動詞，語幹 つかい。', batch:18 },
  { id:'c21-q7', ch:21, type:'mc', q:'「これは つかいやすいません」哪裡錯了？', choices:['やすい 是い形容詞不能接 ません，要說 つかいやすくないです','沒有錯','應該說 つかいやすいでした'], answer:'やすい 是い形容詞不能接 ません，要說 つかいやすくないです', explain:'這就是第 9 章 ×たべたいません 的翻版。〜やすい／〜にくい 雖然是從動詞長出來的，接上去之後整串是い形容詞，ません 這條路只給動詞走。', batch:18 },
  { id:'c21-q8', ch:21, type:'cloze', q:'この くつは あるきやす___です。', zh:'「這雙鞋（那時）很好走。」——填空，把 やすい 變成過去式', answer:'かった', accepted:['かった'], romaji:'kono kutsu wa arukiyasukatta desu.', explain:'過去肯定照第 3 章：い→かった，です 留在最後（第 3 章錯過的 ×たのしかっです 就是漏了 た）。同理還有第 13 章的 なる：よみやすい→よみやすくなりました＝變得好讀了。', batch:18 },
  { id:'c21-q9', ch:21, type:'mc', q:'「にくい」的現在否定該怎麼說？', choices:['にくくない','にくいない','にくじゃない'], answer:'にくくない', explain:'にくい 也是い形容詞，い→くない：にくい→にくくない（＝沒那麼難做）。兩個 く 連在一起最容易少寫一個，唸出來 ni-ku-ku-na-i 才對。じゃない 是な形容詞那條路（第 4 章）。', batch:18 },
  { id:'c21-q10', ch:21, type:'mc', q:'「好讀的書」哪一句對？（ほん＝書）', choices:['よみやすい ほん','よみやすいの ほん','よみやすいな ほん'], answer:'よみやすい ほん', explain:'〜やすい 是い形容詞，修飾名詞直接接上去（第 4、11 章）：加 の 是中文「的」的干擾、加 な 是把它誤當成な形容詞。同理 つかいやすい ペン、あるきやすい くつ。', batch:18 },
  { id:'c21-q11', ch:21, type:'mc', q:'「やすいです」前面沒有接動詞時，是什麼意思？', choices:['便宜（第 15 章的 安い）','容易','困難'], answer:'便宜（第 15 章的 安い）', explain:'兩個同音字靠前面有沒有掛動詞語幹來分：やすい 單獨出現＝安い（便宜），のみやすい 這樣掛在語幹後面＝易い（容易）。順帶再分一次第 15 章那組：やすい（便宜）⇄ やさしい（容易、溫柔）。', batch:18 },
  { id:'c21-q12', ch:21, type:'cloze', q:'にほんご___ わかりやすいです。', zh:'「日文很好懂。」——填助詞', answer:'が', accepted:['が','は'], romaji:'nihongo ga wakariyasui desu.', explain:'わかる 講的是狀態不是動作，對象配 が 不配 を（第 10 章 日本語がわかります）。わかる 的 る 前面是 a 段，所以它是う動詞（第 6 章），語幹 わかり。提出來當話題時說 にほんごは 也通。', batch:18 },
  { id:'c21-q13', ch:21, type:'cloze', q:'読む → ___', zh:'「読む」（＝讀）怎麼唸？——填假名', answer:'よむ', accepted:['よむ'], romaji:'yomu', explain:'読む 唸 よむ 是訓読み；音読み どく 見於 読書。這一章的表格 読む／分かる／飲む 通篇只有漢字，讀音分別是 よむ／わかる／のむ，語幹就是 よみ／わかり／のみ。', batch:18 },
  { id:'c21-q14', ch:21, type:'mc', q:'「これは こわれやすいです」是什麼意思？', choices:['這個很容易壞','這個很難壞','這個已經壞掉了'], answer:'這個很容易壞', explain:'やすい 除了「做起來輕鬆」，也用在「容易發生某事」：こわれやすい＝一不小心就壞。こわれる 在第 17 章看過（こわれています＝壞著的狀態）；這裡講的是傾向不是狀態，「已經壞了」要說 こわれました。', batch:18 },
  { id:'c21-q15', ch:21, type:'mc', q:'べんきょうする（學習）接 やすい 要變成什麼？', choices:['べんきょうしやすい','べんきょうするやすい','べんきょうしますやすい'], answer:'べんきょうしやすい', explain:'語幹一共四類（第 6 章，這裡列滿）：う動詞 u 段→i 段（のむ→のみ・あるく→あるき・つかう→つかい）、る動詞去 る（たべる→たべ・みる→み）、する→し、くる→き。所以 べんきょうする→べんきょうし＋やすい，くる→き＋やすい（きやすい＝容易來）。', batch:18 },
  { id:'c21-q16', ch:21, type:'mc', q:'「この すしは たべにくいです」跟「この すしは たべられません」差在哪裡？', choices:['前者是「不好入口但辦得到」，後者是「根本吃不了」','意思一樣','前者是不想吃，後者是不能吃'], answer:'前者是「不好入口但辦得到」，後者是「根本吃不了」', explain:'にくい 是程度問題（費力、不順手），第 10 章的可能形否定 たべられません 是能力／許可問題（做不到）。中文都可能講成「吃不下」，日文分得很清楚。', batch:18 },
  { id:'c22-q1', ch:22, type:'cloze', q:'いっしょに ばんごはんを たべ___。', zh:'「一起吃晚餐吧。」——填「一起〜吧」的尾巴', answer:'ましょう', accepted:['ましょう'], romaji:'issho ni bangohan o tabemashou.', explain:'約對方一起做，把ます形的 ます 換成 ましょう：たべます→たべましょう。いっしょに（一起）常跟它一起出現，但就算不講，ましょう 本身已經包含「一起」。', batch:19 },
  { id:'c22-q2', ch:22, type:'cloze', q:'こうえんへ ___ましょう。', zh:'「一起去公園吧。」——填「いく」該變成的形', answer:'いき', accepted:['いき'], romaji:'kouen e ikimashou.', explain:'ましょう 接在ます形語幹上：いく 是う動詞，u 段換 i 段→いき。跟第 9 章 いきたい、第 21 章 〜やすい 是同一個插座。目的地的 へ 念 e（第 9 章）。', batch:19 },
  { id:'c22-q3', ch:22, type:'mc', q:'「一起喝咖啡吧」哪一句對？', choices:['コーヒーを のみましょう','コーヒーを のむましょう','コーヒーを のみますましょう'], answer:'コーヒーを のみましょう', explain:'ます 和 ましょう 只能留一個，而且要接在語幹 のみ 上。×のむましょう（接原形）、×のみますましょう（ます 沒拿掉）正是第 10、11、14、17、21 章一路犯過的「尾巴沒接在語幹上」。', batch:19 },
  { id:'c22-q4', ch:22, type:'mc', q:'「〜吧（一起做）」的尾巴，哪個寫法正確？', choices:['ましょう','ましよう','ましょお'], answer:'ましょう', explain:'兩條發音規則同時出現：しょ 的 ょ 是小字（規則 3，拗音合讀，大 よ 就變成 shi-yo 兩拍）；o 段長音用 う 延長（規則 4），不寫 お。整串三拍：ま・しょ・う。', batch:19 },
  { id:'c22-q5', ch:22, type:'mc', q:'「いっしょに いきましょう」是什麼意思？', choices:['一起去吧','我想去','請你去'], answer:'一起去吧', explain:'三個長得像的尾巴分工清楚：ましょう＝我們一起（本章）、たい＝只有我想（第 9 章 いきたい）、てください＝請你做（第 8 章 いってください）。', batch:19 },
  { id:'c22-q6', ch:22, type:'mc', q:'想請客人坐下（只有對方坐，自己不坐），該說哪一句？', choices:['すわってください','すわりましょう','すわりたいです'], answer:'すわってください', explain:'ましょう 一定包含說話的人自己，像台語的「咱」；只有對方要做的事用第 8 章的 てください。すわる 的 わ 是 a 段，所以是う動詞，て形 すわって。', batch:19 },
  { id:'c22-q7', ch:22, type:'mc', q:'ましょう 的「一起」最接近台語哪個字？', choices:['咱（lán）','阮（guán）','恁（lín）'], answer:'咱（lán）', explain:'台語「我們」分兩個：咱 包含聽話的人、阮 不包含。ましょう 只能講「咱」的事——咱來食飯＝ごはんを たべましょう，咱來去＝いきましょう。恁 是「你們」。', batch:19 },
  { id:'c22-q8', ch:22, type:'cloze', q:'では、___ましょう。', zh:'「那麼，開始吧。」（はじめる＝開始）——填「はじめる」該變成的形', answer:'はじめ', accepted:['はじめ'], romaji:'dewa, hajimemashou.', explain:'る動詞去 る 直接接：はじめる→はじめ＋ましょう。這是「帶頭」的用法——事情已經說好了，喊一聲大家一起開始，上課或開會的第一句常聽到。', batch:19 },
  { id:'c22-q9', ch:22, type:'cloze', q:'「えいがを みましょう。」「はい、___。」', zh:'對方約你看電影，你回答「好，看吧。」——填同意的回答', answer:'みましょう', accepted:['みましょう','みましょう。'], romaji:'eiga o mimashou. hai, mimashou.', explain:'答應別人的ましょう，最簡單的方式就是把同一個動詞的ましょう 重複一次。みる 是る動詞，去 る→み＋ましょう。', batch:19 },
  { id:'c22-q10', ch:22, type:'cloze', q:'しゅうまつ、いっしょに べんきょう___。', zh:'「週末一起讀書吧。」——填 する 該變成的形', answer:'しましょう', accepted:['しましょう'], romaji:'shuumatsu, issho ni benkyou shimashou.', explain:'する 的ます形是 します，換尾巴就是 しましょう。名詞＋する 的動詞（べんきょう／うんどう／りょこう）都一樣：べんきょうしましょう。', batch:19 },
  { id:'c22-q11', ch:22, type:'cloze', q:'バス___ えきまで いきましょう。', zh:'「搭公車去車站吧。」——填助詞', answer:'で', accepted:['で'], romaji:'basu de eki made ikimashou.', explain:'ましょう 不會改變助詞：靠什麼去用手段的 で（第 16 章），到哪裡為止用 まで（第 18 章）。中文「搭公車」沒有助詞，最容易漏掉或誤填 を。', batch:19 },
  { id:'c22-q12', ch:22, type:'cloze', q:'ともだちの うち___ かえりましょう。', zh:'「回朋友家吧。」——填表示目的地的助詞', answer:'へ', accepted:['へ','に'], romaji:'tomodachi no uchi e kaerimashou.', explain:'目的地用 へ（念 e）或 に，兩個都對（第 9 章）。かえる 雖然像る動詞，其實是う動詞例外（第 6 章例外表），所以是 かえりましょう 不是 ×かえましょう。', batch:19 },
  { id:'c22-q13', ch:22, type:'mc', q:'下面哪一個是「一起去吧」？', choices:['いきましょう','いきました','いきません','いきませんでした'], answer:'いきましょう', explain:'ます 家族五個形列滿：ます（去）、ません（不去）、ました（去了）、ませんでした（沒去）、ましょう（一起去吧）。ましょう 和 ました 開頭一樣，看第三拍：しょう 是約、した 是過去。', batch:19 },
  { id:'c22-q14', ch:22, type:'cloze', q:'えきまで ___ましょう。', zh:'「一起走到車站吧。」——填「あるく」該變成的形', answer:'あるき', accepted:['あるき'], romaji:'eki made arukimashou.', explain:'あるく 是う動詞，く→き：あるき＋ましょう。九個語尾都照第 6 章的表 u→i（かう→かい、まつ→まち、あそぶ→あそび…），ましょう 沒有自己的新規則。', batch:19 },
  { id:'c22-q15', ch:22, type:'mc', q:'「いっしょに たべましょう」跟「たべたいです」差在哪裡？', choices:['ましょう 是約對方一起吃，たい 只講自己想吃','意思一樣','ましょう 是比較客氣的「想吃」'], answer:'ましょう 是約對方一起吃，たい 只講自己想吃', explain:'たい 是說話者心裡的願望（第 9 章，主語只能是自己）；ましょう 是對著對方的提議，對方也要一起行動。想約人時說 たべたいです 對方只會覺得「你想吃啊」，不會覺得被邀請。', batch:19 },
  { id:'c23-q1', ch:23, type:'cloze', q:'あめ___から、うちに います。', zh:'「因為下雨，待在家裡。」——填 から 前面要補的字', answer:'だ', accepted:['だ','です'], romaji:'ame da kara, uchi ni imasu.', explain:'名詞當理由接 から，要先補 だ（客氣一點補 です）。少了它，あめから 就變成第 11 章「從」的 から，講不通。', batch:20 },
  { id:'c23-q2', ch:23, type:'cloze', q:'あめ___ので、でんしゃで いきます。', zh:'「因為下雨，搭電車去。」——填 ので 前面要補的字', answer:'な', accepted:['な'], romaji:'ame na node, densha de ikimasu.', explain:'ので＝の＋で。名詞、な形容詞碰到 の 要先補 な，跟第 15 章 しずかなの 是同一條。でんしゃで 的 で 是第 16 章的手段。', batch:20 },
  { id:'c23-q3', ch:23, type:'mc', q:'「因為很冷」接 ので，哪個對？', choices:['さむいので','さむいなので','さむいだので'], answer:'さむいので', explain:'い形容詞接 から、ので 都不加東西，直接接。な 和 だ 是給な形容詞、名詞補的，い形容詞用不到。', batch:20 },
  { id:'c23-q4', ch:23, type:'mc', q:'「因為很漂亮」接 から，哪個對？', choices:['きれいだから','きれいから','きれくから'], answer:'きれいだから', explain:'きれい 雖然是 い 結尾，其實是な形容詞（第 4 章誤判表），接 から 要補 だ。×きれくから 是把它當い形容詞活用，跟第 13 章 ×きれくなる 同一個錯。', batch:20 },
  { id:'c23-q5', ch:23, type:'mc', q:'「にほんから きました」的 から 是什麼意思？', choices:['從','因為','到'], answer:'從', explain:'名詞直接接 から＝從（第 11 章 にほんから きた ひと）。要講「因為是日本」得補 だ：にほんだから。「到」是第 18 章的 まで。', batch:20 },
  { id:'c23-q6', ch:23, type:'mc', q:'「因為有空，一起看電影吧」哪句對？', choices:['ひまだから、えいがを みましょう','ひまから、えいがを みましょう','ひまいから、えいがを みましょう'], answer:'ひまだから、えいがを みましょう', explain:'ひま 是な形容詞，接 から 要補 だ；×ひまから 少了 だ，×ひまい 是把它當成い形容詞。後面是約人的 ましょう（第 22 章），用 から 最自然。', batch:20 },
  { id:'c23-q7', ch:23, type:'cloze', q:'「どうして いきませんか。」「いそがしい___。」', zh:'「為什麼不去？」「因為很忙。」——填回答的結尾', answer:'からです', accepted:['からです','ですから','から'], romaji:'doushite ikimasen ka. isogashii kara desu.', explain:'回答 どうして／なぜ（批次3 疑問詞），把理由講完接 からです。いそがしい 是い形容詞，直接接，不補 だ。', batch:20 },
  { id:'c23-q8', ch:23, type:'mc', q:'被問「なぜ かさを もって いますか」（為什麼帶著傘），哪個回答對？', choices:['あめだからです','あめなのでです','あめからです'], answer:'あめだからです', explain:'答句只能用 からです 收尾；ので 後面一定還要接一句結果，不能直接掛 です。あめからです 少了 だ，變成「從雨」。', batch:20 },
