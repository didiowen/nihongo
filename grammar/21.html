  </header>
  <div class="chapter-body">
<h2>句型</h2>
<pre><code>動詞ます形（去ます） ＋ やすい／にくい</code></pre>
<div class="table-wrap"><table><thead><tr><th>動詞</th><th>ます形語幹</th><th>＋やすい</th><th>＋にくい</th></tr></thead><tbody><tr><td>飲む</td><td>飲み</td><td>飲みやすい（好喝／容易入口）</td><td>飲みにくい（難喝）</td></tr><tr><td>読む</td><td>読み</td><td>読みやすい（易讀）</td><td>読みにくい（難讀）</td></tr><tr><td>分かる</td><td>分かり</td><td>分かりやすい（易懂）</td><td>分かりにくい（難懂）</td></tr></tbody></table></div>
<blockquote><p>語感上跟い形容詞「安い」（便宜）同源：東西便宜→讓人輕鬆→引申為「容易」；但這裡是動詞ます形＋やすい的活用文法，不是形容詞本身變化。</p></blockquote>

<script>
// 表格「日文／例句」欄自動附朗讀鍵（speakJa 與 quiz-common.js 同款、本地精簡版）
let _gen = 0;
function speakJa(text) {
  try {
    let t = text.replace(/[（(].*?[）)]/g, '').trim();
    // 「食べる たべる」「かえる 帰る」這種漢字與假名並列的儲存格，整串唸出來會
    // 把同一個字唸兩次。有純假名的那一段就只唸它——假名對 TTS 沒有讀音歧義。
    if (/\s/.test(t)) {
      const kana = t.split(/\s+/).find(s => /^[ぁ-んァ-ヶーヽヾ゛゜]+$/.test(s));
      if (kana) t = kana;
    }
    if (!t) return;
    _gen += 1;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(t);
    u.lang = 'ja-JP'; u.rate = 0.85;
    const v = speechSynthesis.getVoices().filter(v => v.lang.startsWith('ja'))[0];
    if (v) u.voice = v;
    speechSynthesis.speak(u);
  } catch (e) { /* 無語音支援就靜默 */ }
}
document.addEventListener('DOMContentLoaded', () => {
  // 欄名白名單——只有「這一欄裝的是日文」才掛朗讀鍵。漏了活用形那幾欄的話，
  // 第6章的ます形與四個時態、第7章的て形全部沒有聲音，那正是最需要聽的地方。
  const SPEAK_COLS = ['日文', '例句', '例', '例子', '例字', '句型', '假名', '讀法',
                      '原形', '辭書形', '動詞', '禮貌體', 'ます形', 'て形', '＋する',
                      '現在肯定', '現在否定', '過去肯定', '過去否定'];
  document.querySelectorAll('.chapter-body table').forEach(tbl => {
    const ths = [...tbl.querySelectorAll('thead th')].map(th => th.textContent.trim());
    ths.forEach((h, col) => {
      if (!SPEAK_COLS.includes(h)) return;
      tbl.querySelectorAll('tbody tr').forEach(tr => {
        const td = tr.children[col];
        if (!td) return;
        const raw = td.textContent.trim();
        if (!raw || raw === '—' || /^[A-Za-z0-9\s.…]+$/.test(raw)) return;
        const btn = document.createElement('button');
        btn.className = 'speak-btn'; btn.type = 'button';
        btn.title = '朗讀'; btn.textContent = '🔊';
        btn.addEventListener('click', () => speakJa(raw));
        td.appendChild(btn);
      });
    });
  });
});
</script>
