<html lang="zh-TW">

<meta charset="UTF-8">

<title>單字測驗</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+TC:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="quiz-common.css">
<style>
/* 回饋列末端的「回〈某批〉→」連結——尺寸壓小，不跟正解搶注意力 */
.feedback .lesson-link {
  font-size: 0.82em;
  white-space: nowrap;
  text-decoration: underline;
  text-underline-offset: 4px;
}
.wrong-back a { font-size: 0.9em; }

/* ── Section tabs ── */
.section-tabs {
  display: flex;
  gap: 0;
  max-width: 360px;
  width: 100%;
  margin-bottom: 20px;
  border: 1.5px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
}
.section-tab {
  flex: 1;
  padding: 12px 8px;
  border: none;
  background: white;
  color: var(--neutral);
  font-family: 'Noto Sans JP', 'Noto Sans TC', sans-serif;
  font-size: 1rem;
  cursor: pointer;
  letter-spacing: 0.04em;
  transition: all 0.2s;
  border-right: 1px solid var(--border);
}

/* ── Mode tabs（四格，五十音用）── */
.mode-tabs {
  display: flex;
  gap: 0;
  max-width: 360px;
  width: 100%;
  margin-bottom: 18px;
  border: 1.5px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
}
.mode-tab {
  flex: 1;
  padding: 10px 4px;
  border: none;
  background: white;
  color: var(--neutral);
  font-family: 'Noto Sans JP', 'Noto Sans TC', sans-serif;
  font-size: 0.85rem;
  cursor: pointer;
  letter-spacing: 0.02em;
  line-height: 1.3;
  transition: all 0.2s;
  border-right: 1px solid var(--border);
  text-align: center;
}

/* ── Vocab mode toggle（單字方向，保留） ── */
.mode-toggle {
  display: flex;
  gap: 8px;
  max-width: 360px;
  width: 100%;
  margin-bottom: 18px;
  background: rgba(0,0,0,0.06);
  border-radius: 10px;
  padding: 4px;
}
.mode-btn {
  flex: 1;
  padding: 8px;
  border: none;
  border-radius: 7px;
  font-size: 0.95rem;
  font-family: 'Noto Sans JP', 'Noto Sans TC', sans-serif;
  cursor: pointer;
  background: transparent;
  color: var(--soft);
  transition: all 0.2s;
}
.mode-btn.active {
  background: white;
  color: var(--ink);
  font-weight: 400;
}

/* ── Progress ── */

/* ── Card ── */

.main-char {
  font-family: 'Noto Sans JP', 'Noto Sans TC', sans-serif;
  font-size: 4.5rem;
  text-align: center;
  line-height: 1;
  margin: 8px 0 6px;
  color: var(--ink);
}
.main-meaning {
  font-size: 1.8rem;
  text-align: center;
  line-height: 1.3;
  margin: 8px 0 6px;
  color: var(--ink);
  font-weight: 400;
}
.hint { font-size: 0.88rem; color: var(--neutral); text-align: center; margin-bottom: 20px; min-height: 16px; font-style: italic; }

/* ── Options ── */

.option-btn {
  background: white;
  border: 1.5px solid var(--border);
  border-radius: 10px;
  padding: 13px 8px;
  font-size: 1.05rem;
  font-family: 'Noto Sans JP', 'Noto Sans TC', sans-serif;
  cursor: pointer;
  transition: all 0.15s;
  color: var(--ink);
  text-align: center;
  line-height: 1.3;
}

.option-btn.vocab { font-family: 'Noto Sans JP', 'Noto Sans TC', sans-serif; font-size: 1rem; }

/* ── Input ── */

.input-hint { font-size: 0.85rem; color: var(--neutral); text-align: center; margin-bottom: 10px; font-style: italic; }

/* ── Buttons ── */

/* ── Feedback ── */
.feedback {
  min-height: 44px;
  text-align: center;
  padding: 10px;
  border-radius: 8px;
  font-size: 0.95rem;
  line-height: 1.5;
  transition: all 0.2s;
  margin-bottom: 10px;
}

/* ── Score ── */

/* ── Result ── */

/* ── Wrong-answer review ── */

/* ── Topic filter ── */
.topic-filter {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  max-width: 360px;
  width: 100%;
  margin-bottom: 14px;
}
.topic-btn {
  padding: 5px 10px;
  border: 1.5px solid var(--border);
  border-radius: 20px;
  font-size: 0.88rem;
  font-family: 'Noto Sans JP', 'Noto Sans TC', sans-serif;
  cursor: pointer;
  background: white;
  color: var(--soft);
  transition: all 0.15s;
}

/* ── Hint toggle ── */

/* ── Round filter ── */

/* ── Nav links ── */

/* ── User sync badge ── */

<body>

<nav class="nav-links">
  <a href="index.html">← 首頁</a>
  <a href="vocab/">📘 單字課程</a>
  <button class="user-badge" id="userBadge" onclick="openUserModal()" title="切換使用者">

    <span id="userLabel">…</span>

<div class="user-modal-overlay" id="userModalOverlay">

    <input type="text" id="userIdInput" placeholder="例：didi-2026" maxlength="20"

    <div class="user-modal-err" id="userModalErr"></div>
    <div class="user-modal-btns">
      <button class="btn-cancel" id="userCancelBtn" onclick="closeUserModal()">取消</button>
      <button class="btn-confirm" onclick="confirmUserId()">確認</button>
    </div>
  </div>
</div>

<!-- 篩選列＝課程批次。本頁只收每日課程教過的字，沒有假名輪次那一軸。 -->
<div class="round-filter" id="roundFilter"></div>

<!-- 提示開關 -->
<div class="hint-toggle-wrap" id="hintToggleWrap">

</div>

<!-- 出題方向 -->
<div class="mode-toggle" id="vocabToggle">

</div>

<div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>

<div class="card" id="mainCard">
  <span class="sr-badge">SRS</span>
  <div id="quizContent"></div>
</div>

<div class="score-display">

function lessonHref(b) {
  // batch 0 ＝ 預習（還沒教到），沒有課程頁可回
  return b ? `vocab/${String(b).padStart(2, '0')}.html` : '';
}
function renderFilter() {
  const nums = [...new Set(vocabCards.map(c => c.batch))].sort((a, b) => a - b);
  const wrap = document.getElementById('roundFilter');
  wrap.innerHTML = `<button class="round-btn${currentBatch === -1 ? ' active' : ''}" data-batch="-1">全部</button>`
    + nums.map(n =>
      `<button class="round-btn${currentBatch === n ? ' active' : ''}" data-batch="${n}" title="${escapeHtml(lessonTitles[n] || '')}">${n === 0 ? '預習' : '批次' + n}</button>`
    ).join('');
  wrap.querySelectorAll('.round-btn').forEach(b =>
    b.addEventListener('click', () => setBatch(parseInt(b.dataset.batch, 10))));
}

function setBatch(n) {
  currentBatch = n;
  renderFilter();
  vocabQueue = getFilteredVocab();
  resetScore();
  nextCard();
}

function getFilteredVocab() {
  const filtered = currentBatch === -1 ? vocabCards
                                      : vocabCards.filter(c => c.batch === currentBatch);
  return filtered.map(c => {
    const saved = vocabProgress[c.display];
    // 沒做過的字用 batch 當優先度：越晚教的越早排進來
    return { ...c, level: saved ?? 0, nextReview: saved != null ? 0 : -(c.batch * 5) };
  });
}

function getSessionLimit() {
  const pool = currentBatch === -1 ? vocabCards.length
                                   : vocabCards.filter(c => c.batch === currentBatch).length;
  return Math.min(Math.max(Math.round(pool * 0.5), 10), 40);
}

  vocabDir = dir;
  document.getElementById('btnJpToZh').classList.toggle('active', dir === 'jp-to-zh');
  document.getElementById('btnZhToJp').classList.toggle('active', dir === 'zh-to-jp');
  vocabQueue = getFilteredVocab();
  resetScore();
  nextCard();
}

function toggleHint() {
  showHint = !showHint;
  const btn = document.getElementById('hintToggleBtn');
  btn.textContent = showHint ? '提示：開' : '提示：關';

    hintEl.textContent = showHint ? `💡 ${currentVocab.reading}` : '';
  }
}

// ═══════════════════════════════
// VOCAB: MULTIPLE CHOICE (both directions)
// ═══════════════════════════════
function getVocabDistractors(vocab) {
  // 干擾項按「語意接近程度」分層取：同一課的字 → 同主題的字 → 其餘。
  // 隨機抽整個字池的話，選項常常一眼就能刪掉（時間詞裡混一個家族稱謂），等於沒在考。
  const correct = vocabDir === 'jp-to-zh' ? vocab.meaning : vocab.display;
  const getVal = v => vocabDir === 'jp-to-zh' ? v.meaning : v.display;
  const others = vocabCards.filter(v => getVal(v) !== correct);
  const tiers = [
    others.filter(v => v.batch === vocab.batch),
    others.filter(v => v.batch !== vocab.batch && v.topic && v.topic === vocab.topic),
    others,
  ];
  const picked = [];
  for (const tier of tiers) {
    for (const val of shuffle(tier).map(getVal)) {
      if (picked.length >= 3) break;
      if (!picked.includes(val)) picked.push(val);
    }
    if (picked.length >= 3) break;
  }
  return shuffle([correct, ...picked]);
}

function renderVocabMultiple() {
  const options = getVocabDistractors(currentVocab);
  const question = vocabDir === 'jp-to-zh' ? currentVocab.display : currentVocab.meaning;
  const qtype = vocabDir === 'jp-to-zh' ? '這個日文是什麼意思？' : '這個日文怎麼說？';
  const isJp = vocabDir === 'jp-to-zh';

  document.getElementById('quizContent').innerHTML = `
    <div class="question-type">${qtype}</div>
    <div class="${isJp ? 'main-char' : 'main-meaning'}" style="${isJp ? 'font-size:2.8rem' : ''}">${question}</div>
    <div class="hint" id="hintText">${showHint && vocabDir === 'jp-to-zh' ? `💡 ${currentVocab.reading}` : ''}</div>
    <div class="options">
      ${options.map(opt => `<button class="option-btn vocab" onclick="checkVocabMultiple('${opt.replace(/'/g, "\\'")}', this)">${opt}</button>`).join('')}
    </div>
    <div class="feedback" id="feedback"></div>
    <button class="next-btn" id="nextBtn" onclick="nextCard()">下一題 →</button>
  `;
}

function checkVocabMultiple(chosen, btn) {
  if (answered) return;
  answered = true;
  // Accept all meanings sharing the same display (homonyms like さけ＝鮭魚／酒)
  const correctAnswers = vocabDir === 'jp-to-zh'
    ? vocabCards.filter(c => c.display === currentVocab.display).map(c => c.meaning)
    : [currentVocab.display];
  const isCorrect = correctAnswers.includes(chosen);
  document.querySelectorAll('.option-btn').forEach(b => {
    b.disabled = true;
    if (correctAnswers.includes(b.textContent.trim())) b.classList.add('correct');
  });
  if (!isCorrect) btn.classList.add('wrong');
  advanceSRS(currentVocab, isCorrect);
  const fb = document.getElementById('feedback');
  fb.className = `feedback ${isCorrect ? 'show-correct' : 'show-wrong'}`;
  const kp = currentVocab.kanji ? `${currentVocab.kanji} ` : '';
  const wrongHint = vocabDir === 'jp-to-zh' ? correctAnswers.join('／') : `${kp}${currentVocab.display}`;
  const lh = lessonHref(currentVocab.batch);
  fb.innerHTML = (isCorrect ? `✓ 正確！` : `✗ 正確是「${wrongHint}」`)
    + ` <button class="speak-btn" onclick="speakJa(currentVocab.display)" title="朗讀">🔊</button>`
    + (lh ? `　<a class="lesson-link" href="${lh}">回「${escapeHtml(lessonTitles[currentVocab.batch] || '')}」→</a>` : '');
  document.getElementById('hintText').textContent = `💡 ${kp}${currentVocab.display}（${currentVocab.reading}）`;
  document.getElementById('nextBtn').classList.add('visible');
}

// ═══════════════════════════════
// RESULT
// ═══════════════════════════════
function restartCurrent() {
  vocabQueue = getFilteredVocab();
  resetScore();
  nextCard();
}

// ═══════════════════════════════
// PAGE HOOK（quiz-common.js 呼叫）
// ═══════════════════════════════
function rebuildQueues() {
  renderFilter();     // quiz-common.js 已載入，escapeHtml 可用
  vocabQueue = getFilteredVocab();
}

// ?batch=N 深連結：課程頁的「練這批字」按鈕會帶進來
(function () {
  const n = parseInt(new URLSearchParams(location.search).get('batch'), 10);
  if (Number.isInteger(n) && vocabCards.some(c => c.batch === n)) currentBatch = n;   // 含 0＝預習
})();
</script>
<script src="quiz-common.js"></script>
<script>
// 覆寫 quiz-common.js 的 renderWrongList：多一條回課程頁的連結。答錯當下回饋列
// 已經有連結，但一輪結束後回顧時最想做的就是跳回那一批的講解，這裡才是入口。
// 必須放在 quiz-common.js 之後（showResult 執行時才呼叫，重綁安全）。
function renderWrongList() {
  if (wrongAnswers.size === 0) return '';
  const items = [...wrongAnswers.values()].map(c => {
    const kp = c.kanji ? `${escapeHtml(c.kanji)} ` : '';
    const lh = lessonHref(c.batch);
    const back = `${escapeHtml(c.reading)}　${escapeHtml(c.meaning)}`
      + (lh ? `<br><a href="${lh}">回「${escapeHtml(lessonTitles[c.batch] || '')}」→</a>` : '');
    return `<div class="wrong-item"><span class="wrong-front">${kp}${escapeHtml(c.display)}</span>`
      + `<span class="wrong-back">${back}</span></div>`;
  }).join('');
  return `<div class="wrong-list"><div class="wrong-title">答錯回顧（${wrongAnswers.size}）</div>${items}</div>`;
}
</script>
